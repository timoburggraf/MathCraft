<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>MathCraft</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='s' x1='0' y1='1' x2='1' y2='0'%3E%3Cstop offset='0' stop-color='%231b2a6b'/%3E%3Cstop offset='.5' stop-color='%2325d0c0'/%3E%3Cstop offset='1' stop-color='%23ffb238'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%230b1020'/%3E%3Crect x='9' y='9' width='46' height='46' rx='9' fill='url(%23s)'/%3E%3Cg fill='%230b1020'%3E%3Crect x='16' y='29' width='32' height='6' rx='3'/%3E%3Crect x='29' y='16' width='6' height='32' rx='3'/%3E%3C/g%3E%3C/svg%3E">
<style>
/* ============================================================ Design-System
   Übernommen aus VokabelQuest — dieselbe Familie, andere Farbe: kühles Blau
   statt Violett, damit sich die beiden Apps auf dem Tablet nicht verwechseln. */
:root{
  --bg:#0b1020; --card:rgba(255,255,255,.055); --card2:rgba(255,255,255,.10);
  --line:rgba(255,255,255,.13); --txt:#eef3ff; --dim:#94a6c8;
  --coral:#ff6a4d; --pink:#ff4d94; --amber:#ffb238; --teal:#25d0c0; --violet:#5b8cff;
  --good:#2fd77f; --bad:#ff5a68;
  --r:20px; --sh:0 18px 44px rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--txt);
  font-family:"Segoe UI Variable Display","Segoe UI",Inter,system-ui,-apple-system,"Helvetica Neue",sans-serif;
  font-size:17px;line-height:1.45;overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(900px 600px at 8% -10%,rgba(91,140,255,.30),transparent 60%),
             radial-gradient(760px 520px at 102% 4%,rgba(37,208,192,.20),transparent 58%),
             radial-gradient(700px 700px at 50% 115%,rgba(255,178,56,.12),transparent 60%)}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
.app{max-width:780px;margin:0 auto;padding:0 16px 110px;position:relative;z-index:1}
body.insession .app{padding-bottom:14px}
body.insession .stop{padding-top:10px;padding-bottom:8px}
body.insession .roundlbl{margin-bottom:9px}
#fitwrap>div{transform-origin:top center;transition:transform .18s ease-out}
@media (max-height:760px){
  body.insession .q{padding:14px 14px 10px}
  body.insession .q .word{font-size:26px}
  body.insession .q .word.sm{font-size:20px}
  body.insession .opt{padding:12px 15px}
  body.insession .opts{gap:8px;margin-top:12px}
  body.insession .card{padding:14px}
  body.insession .fb{margin-top:11px;padding:12px 14px}
  body.insession .pad button{min-height:46px;font-size:21px}
  body.insession .disp{font-size:30px;padding:10px}
}
body.native .app{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
body.native .hero{margin-top:calc(-1 * env(safe-area-inset-top))}
body.native .hero .on{padding-top:calc(16px + env(safe-area-inset-top))}
body.native .stop{padding-top:calc(14px + env(safe-area-inset-top))}
body.native{overscroll-behavior:none}
body.native .opt,body.native .btn,body.native .pad button{user-select:none}

/* ------------------------------------------------------------- Grundelemente */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;
      backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:15px 20px;
     border-radius:15px;font-weight:650;font-size:16.5px;background:var(--card2);
     border:1px solid var(--line);min-height:54px;transition:transform .1s,filter .15s;
     backdrop-filter:blur(10px)}
.btn:hover:not(:disabled){filter:brightness(1.35)}
.btn:active:not(:disabled){transform:scale(.975)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.primary{background:linear-gradient(115deg,var(--teal),var(--violet));border:0;color:#04262b;
             font-weight:780;box-shadow:0 12px 30px rgba(37,208,192,.3)}
.btn.teal{background:linear-gradient(115deg,var(--teal),#3a9bff);border:0;color:#032b2a;font-weight:750}
.btn.wide{width:100%}
.row{display:flex;gap:10px}.row.wrap{flex-wrap:wrap}
.grow{flex:1}.muted{color:var(--dim)}.center{text-align:center}
h1,h2,h3{margin:0 0 9px;line-height:1.18;letter-spacing:-.4px}
h1{font-size:29px;font-weight:800}h2{font-size:22px;font-weight:750}h3{font-size:16px;font-weight:700}
.eyebrow{font-size:12.5px;font-weight:800;letter-spacing:2.2px;text-transform:uppercase;color:var(--dim)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:99px;
      background:rgba(0,0,0,.4);border:1px solid var(--line);font-size:14px;font-weight:750;
      backdrop-filter:blur(8px)}
.sep{height:1px;background:var(--line);margin:16px 0}

/* -------------------------------------------------------------------- Hero */
.hero{position:relative;margin:0 -16px 16px;height:262px;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(11,16,32,.62) 0%,rgba(11,16,32,.12) 34%,rgba(11,16,32,.93) 100%)}
.hero .on{position:absolute;inset:0;z-index:2;padding:16px;display:flex;flex-direction:column;justify-content:space-between}
.hero .bot{display:flex;align-items:flex-end;gap:12px}
.hero h1{text-shadow:0 3px 22px rgba(0,0,0,.75);margin:0}
.xpbar{height:7px;border-radius:99px;background:rgba(0,0,0,.55);overflow:hidden;margin-top:8px;
       border:1px solid rgba(255,255,255,.1)}
.xpbar>i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--amber),var(--coral));transition:width .6s cubic-bezier(.2,.8,.2,1)}

/* --------------------------------------------------------------- Tagesziel */
.goal{display:flex;align-items:center;gap:18px}
.ring{width:104px;height:104px;flex:none;border-radius:50%;display:grid;place-items:center;position:relative}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .in{text-align:center;line-height:1.05;z-index:1}
.ring b{font-size:26px;font-weight:800;display:block;letter-spacing:-1px}

/* -------------------------------------------------------------- Landkarte */
.uc{position:relative;border-radius:var(--r);overflow:hidden;margin-bottom:12px;
    border:1px solid var(--line);background:var(--card)}
.uc>.hd{width:100%;display:block;text-align:left;position:relative;height:132px}
.uc>.hd img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.uc>.hd:hover img{transform:scale(1.045)}
.uc>.hd::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(11,16,32,.94) 4%,rgba(11,16,32,.55) 55%,rgba(11,16,32,.2) 100%)}
.uc .txt{position:absolute;inset:0;z-index:2;padding:14px 16px;display:flex;flex-direction:column;justify-content:center}
.uc .txt b{font-size:18px;font-weight:780;letter-spacing:-.3px;text-shadow:0 2px 14px rgba(0,0,0,.8)}
.bar{height:6px;border-radius:99px;background:rgba(0,0,0,.55);overflow:hidden;margin-top:7px;max-width:280px}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--amber));transition:width .5s}
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:9px;padding:11px}
.pk{padding:12px 13px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);
    text-align:left;display:flex;flex-direction:column;gap:4px;min-height:84px;transition:.15s}
.pk:hover:not(:disabled){background:rgba(255,255,255,.11);transform:translateY(-2px)}
.pk:disabled{opacity:.4;cursor:not-allowed}
.pk .t{font-size:13.5px;font-weight:700;line-height:1.25}
.pk .s{font-size:13px;letter-spacing:2.5px;color:var(--amber)}
.pk .lv{font-size:11.5px;font-weight:800;letter-spacing:1.4px;color:var(--dim);text-transform:uppercase}
.pk.done{border-color:rgba(47,215,127,.45);background:rgba(47,215,127,.09)}

/* ---------------------------------------------------------------- Session */
.stop{display:flex;align-items:center;gap:11px;padding:14px 0 12px;position:sticky;top:0;z-index:5;
      background:linear-gradient(180deg,var(--bg) 62%,transparent);margin:0 -16px;padding-left:16px;padding-right:16px}
.prog{flex:1;height:9px;border-radius:99px;background:rgba(255,255,255,.11);overflow:hidden}
.prog>i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--teal),var(--amber));transition:width .35s}
.combo{font-weight:800;color:var(--amber);font-size:15px;white-space:nowrap}
.roundlbl{text-align:center;margin-bottom:14px}

.q{text-align:center;padding:22px 18px 18px}
.q .word{font-size:25px;font-weight:750;margin:8px 0 4px;line-height:1.32;letter-spacing:-.3px;word-break:break-word}
.q .word.sm{font-size:20px;line-height:1.4}
.q .big{font-size:44px;font-weight:800;letter-spacing:-1px;margin:6px 0}
.q .sub{color:var(--dim);font-size:15.5px;margin-top:4px}
.spk{width:46px;height:46px;border-radius:50%;background:var(--card2);border:1px solid var(--line);
     display:inline-grid;place-items:center;font-size:20px;margin-top:8px;transition:.15s}
.spk:hover{background:rgba(255,255,255,.2);transform:scale(1.07)}

.opts{display:grid;gap:10px;margin-top:16px}
.opt{padding:16px 18px;border-radius:15px;background:var(--card2);border:2px solid var(--line);
     text-align:left;font-weight:640;font-size:16.5px;transition:transform .1s,background .2s,border-color .2s}
.opt:hover:not(:disabled){background:rgba(255,255,255,.17)}
.opt:active:not(:disabled){transform:scale(.985)}
.opt.right{background:rgba(47,215,127,.24);border-color:var(--good)}
.opt.wrong{background:rgba(255,90,104,.2);border-color:var(--bad)}
.opt:disabled{cursor:default}

/* ---- Ziffernfeld: eigenes Numpad statt Systemtastatur. Auf dem Tablet
   verdeckt die eingeblendete Tastatur sonst die halbe Aufgabe. ---- */
.disp{font-size:36px;font-weight:800;text-align:center;padding:12px;border-radius:15px;
      background:rgba(0,0,0,.4);border:2px solid var(--line);min-height:62px;letter-spacing:1px;
      font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center}
.disp.right{border-color:var(--good);background:rgba(47,215,127,.16)}
.disp.wrong{border-color:var(--bad);background:rgba(255,90,104,.14)}
.disp .ph{color:rgba(255,255,255,.2);font-weight:600;font-size:22px;letter-spacing:0}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:11px}
.pad button{min-height:56px;border-radius:14px;background:var(--card2);border:1px solid var(--line);
  font-size:25px;font-weight:750;font-variant-numeric:tabular-nums;transition:transform .08s,background .15s}
.pad button:hover:not(:disabled){background:rgba(255,255,255,.19)}
.pad button:active:not(:disabled){transform:scale(.94)}
.pad button:disabled{opacity:.3;cursor:not-allowed}
.pad button.act{background:linear-gradient(115deg,var(--teal),var(--violet));color:#04262b;font-weight:800;border:0}
.pad button.del{font-size:21px}

/* ---- Ordnen: Zahlenkarten antippen ---- */
.chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:14px}
.chip{padding:14px 20px;border-radius:14px;background:var(--card2);border:2px solid var(--line);
      font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;transition:.15s;min-width:66px}
.chip:hover:not(:disabled){background:rgba(255,255,255,.18)}
.chip.used{opacity:.28;pointer-events:none}
.chip.right{background:rgba(47,215,127,.24);border-color:var(--good)}
.chip.wrong{background:rgba(255,90,104,.2);border-color:var(--bad)}
.slotrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px;min-height:56px}
.slot{width:60px;height:54px;border-radius:13px;border:2px dashed var(--line);display:grid;place-items:center;
      font-size:21px;font-weight:800;color:var(--dim);font-variant-numeric:tabular-nums}
.slot.set{border-style:solid;border-color:var(--teal);color:var(--txt);background:rgba(37,208,192,.12)}

/* ---- Zuordnen: zwei Spalten ---- */
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.pcard{padding:14px 12px;border-radius:14px;background:var(--card2);border:2px solid var(--line);
       font-weight:700;font-size:15.5px;text-align:center;transition:.15s;min-height:56px;
       display:flex;align-items:center;justify-content:center}
.pcard:hover:not(:disabled){background:rgba(255,255,255,.18)}
.pcard.sel{border-color:var(--amber);background:rgba(255,178,56,.16)}
.pcard.done{opacity:.42;border-color:var(--good);background:rgba(47,215,127,.12);pointer-events:none}
.pcard.miss{border-color:var(--bad);background:rgba(255,90,104,.16)}

/* ---- Gitter ---- */
.grid{display:grid;gap:5px;justify-content:center;margin:14px auto 0}
.cell{width:44px;height:44px;border-radius:10px;background:rgba(255,255,255,.07);border:1px solid var(--line);
      display:grid;place-items:center;font-size:22px;transition:.12s}
button.cell:hover:not(:disabled){background:rgba(255,255,255,.2);transform:scale(1.06)}
.cell.right{background:rgba(47,215,127,.3);border-color:var(--good)}
.cell.wrong{background:rgba(255,90,104,.25);border-color:var(--bad)}

/* ---- Mehrschritt ---- */
.steps{display:flex;gap:7px;justify-content:center;margin-bottom:4px}
.stepdot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.2)}
.stepdot.on{background:var(--teal);box-shadow:0 0 10px rgba(37,208,192,.7)}
.stepdot.ok{background:var(--good)}
.story{padding:13px 15px;border-radius:14px;background:rgba(0,0,0,.28);border:1px solid var(--line);
       font-size:16px;line-height:1.5;margin-bottom:12px;text-align:left}

.fb{margin-top:15px;padding:15px 17px;border-radius:15px;font-weight:700;animation:pop .28s}
.fb.ok{background:rgba(47,215,127,.15);border:1px solid rgba(47,215,127,.45)}
.fb.no{background:rgba(255,90,104,.13);border:1px solid rgba(255,90,104,.45)}
.fb.near{background:rgba(255,178,56,.14);border:1px solid rgba(255,178,56,.5)}
.fb .sol{margin-top:5px;font-weight:600;font-size:16px}
.fb .sol b{font-weight:800}
.tip{margin-top:11px;padding:12px 14px;border-radius:13px;background:rgba(255,178,56,.13);
  border:1px solid rgba(255,178,56,.4);font-weight:600;font-size:15.5px;line-height:1.5;text-align:left}
.bsp{margin-top:9px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.07);
  font-weight:700;font-size:16px;line-height:1.5}
.bsp .rw{display:block;margin-top:4px;font-size:19px;color:var(--teal);letter-spacing:.02em}
/* „Erklär es mir“ — beim Fehler, nicht erst beim zweiten. Der Knopf ist bewusst
   groß und ruhig: Er soll für ein Achtjähriges zu treffen sein und nicht wie
   ein Eingeständnis aussehen. */
.erk{margin-top:11px;width:100%;padding:12px 14px;border-radius:13px;
  background:rgba(37,208,192,.14);border:1px solid rgba(37,208,192,.45);
  color:var(--teal);font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.erk:active{background:rgba(37,208,192,.26)}
.info{margin-top:12px;padding:14px 16px;border-radius:14px;background:rgba(37,208,192,.1);
  border:1px solid rgba(37,208,192,.35);font-size:16.5px;line-height:1.55;text-align:left}

/* ---- Logikgitter (D4/D1): Hinweisliste und Denkhilfe ---- */
.hlwrap{margin-top:14px;text-align:left}
.hlist{margin:6px 0 0;padding-left:24px}
.hlist li{margin-bottom:7px;line-height:1.42;font-size:15.5px}
.denkhilfe{margin-top:14px;text-align:left}
.dh-toggle{width:100%;padding:12px 14px;border-radius:13px;background:var(--card2);
  border:1px solid var(--line);font-weight:700;font-size:14.5px;text-align:center}
.dh-toggle:active{transform:scale(.985)}
.dh-scroll{overflow-x:auto;margin-top:9px;-webkit-overflow-scrolling:touch}
.dh-table{border-collapse:collapse;width:100%}
.dh-table th,.dh-table td{padding:4px}
.dh-table th{font-size:11.5px;font-weight:700;color:var(--dim);white-space:nowrap;text-align:center}
.dh-table th:first-child,.dh-table td:first-child{text-align:left;white-space:nowrap;
  padding-right:9px;font-size:13.5px;font-weight:700}
.dh-cell{width:38px;height:38px;border-radius:9px;background:rgba(255,255,255,.06);
  border:1px solid var(--line);font-size:16px;font-weight:800;transition:.12s}
.dh-cell:active{transform:scale(.92)}
.dh-cell.ja{background:rgba(47,215,127,.22);border-color:var(--good);color:var(--good)}
.dh-cell.nein{background:rgba(255,90,104,.18);border-color:var(--bad);color:var(--bad)}

/* ---- Roboter / Bildwahl / Positionen (D2 algo, geo/muster, log_position) ---- */
.rob-grid{display:grid;gap:4px;justify-content:center;margin:14px auto 0}
.rob-cell{width:44px;height:44px;border-radius:10px;background:rgba(255,255,255,.07);
  border:1px solid var(--line);display:grid;place-items:center;font-size:20px;
  color:var(--teal);transition:.12s}
button.rob-cell:hover:not(:disabled){background:rgba(255,255,255,.2);transform:scale(1.06)}
.rob-cell.wall{background:rgba(255,90,104,.08)}
.rob-cell.start{border-style:dashed;border-color:var(--amber)}
.rob-cell.right{background:rgba(47,215,127,.3);border-color:var(--good)}
.rob-cell.wrong{background:rgba(255,90,104,.25);border-color:var(--bad)}
.rob-fig{width:24px;height:24px}

.rob-progwrap{margin-top:12px;text-align:center}
.rob-prog{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.rob-loop{display:inline-flex;align-items:center;gap:4px;padding:4px 7px;border-radius:11px;
  border:1px dashed var(--line);font-size:13px;font-weight:700;color:var(--dim)}
.rob-chip{display:inline-flex;align-items:center;gap:4px;padding:8px 11px;border-radius:11px;
  background:var(--card2);border:2px solid var(--line);font-size:18px;min-width:34px;
  justify-content:center}
button.rob-chip{transition:.15s}
button.rob-chip:hover:not(:disabled){background:rgba(255,255,255,.18)}
.rob-chip.right{background:rgba(47,215,127,.24);border-color:var(--good)}
.rob-chip.wrong{background:rgba(255,90,104,.2);border-color:var(--bad)}
.rob-nr{font-size:11px;font-weight:800;color:var(--dim)}

.rob-zeile{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px;min-height:44px}
.rob-slot{width:42px;height:42px;border-radius:11px;border:2px dashed var(--line);
  display:grid;place-items:center;font-size:19px;color:var(--dim)}
.rob-slot.set{border-style:solid;border-color:var(--teal);color:var(--txt);background:rgba(37,208,192,.12)}

.rob-palette{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.rob-pal{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 12px;
  border-radius:13px;background:var(--card2);border:1px solid var(--line);min-width:68px;
  font-size:20px;transition:.15s}
.rob-pal:hover:not(:disabled){background:rgba(255,255,255,.18)}
.rob-pal span{font-size:11.5px;font-weight:700;color:var(--dim)}

.bw-frage{max-width:62%;margin:14px auto 0}
.bw-frage.breit{max-width:100%}
.bw-frage svg{width:100%;height:auto;display:block}
.bw-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.bw-opt{padding:8px;border-radius:14px;background:var(--card2);border:2px solid var(--line);transition:.15s}
.bw-opt svg{width:100%;height:auto;display:block}
.bw-opt:hover:not(:disabled){background:rgba(255,255,255,.17)}
.bw-opt.right{border-color:var(--good);background:rgba(47,215,127,.18)}
.bw-opt.wrong{border-color:var(--bad);background:rgba(255,90,104,.16)}

/* --------------------------------------------------------- Ergebnis / Rest */
.stars{font-size:56px;letter-spacing:10px;margin:8px 0 4px;line-height:1;color:var(--amber);
       text-shadow:0 0 26px rgba(255,178,56,.55)}
.stars .off,.pk .s .off{opacity:.17;color:#fff;text-shadow:none}
.badge{display:flex;gap:14px;align-items:center;padding:13px;border-radius:15px;
       background:rgba(255,255,255,.05);border:1px solid var(--line);margin-bottom:9px}
.badge.locked{opacity:.36}
.badge .e{font-size:29px;width:44px;text-align:center;flex:none}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}

<body>
<canvas id="cfx"></canvas>
<div class="app" id="app"></div>
<!-- D5: der Würfelfuchs lebt hier, außerhalb des Routers — siehe renderGef() -->
<div id="gefroot"></div>

<script>
"use strict";
/* ==================================================================== Daten
   Wird beim Bauen eingesetzt: Lernpakete, Lehrplan und Bilder. Danach läuft
   die App vollständig offline. */
const DATA = /*__DATA__*/null;
const IMG  = /*__IMG__*/{};
/* D5: die zehn Posen des Würfelfuchses, als Alpha-WebP eingebettet — siehe
   img/avatar_fuchs/manifest.json und build/build.py:encode_avatar(). */
const AVATAR = /*__AVATAR__*/{};
/* D1: die fünf Denkdisziplinen der Denkschule (ZIELE-V2.md) — Titel,
   Beschreibung und zugeordnete Fertigkeiten je Disziplin, dazu die Liste der
   restlichen Pre-Lesson-Fertigkeiten. Siehe build/disziplinen.py (die Quelle
   der Wahrheit) und build/build.py:disziplinen_data() (die Einbettung). Reine
   Darstellungsdaten — die Auswahl-Logik (waehleUnit()) liest sie nicht. */
const DISZIPLIN_DATEN = /*__DISZIPLINEN__*/{disziplinen:{}, preLesson:[]};
const DISZIPLINEN = DISZIPLIN_DATEN.disziplinen;
const PRE_LESSON_SKILLS = DISZIPLIN_DATEN.preLesson;
/* Eigene Fassung und die voreingestellte Adresse des Heim-Dienstes. Beides
   setzt der Bau ein; die Adresse lässt sich in den Einstellungen ändern. */
const BUILD = /*__BUILD__*/{code:0, name:"Entwicklung", server:""};

const AREAS  = DATA.areas;
const SKILLS = DATA.skills;
const WORLDS = DATA.worlds;
const STAGES = DATA.stages;
/* Klasse -> Einstiegsstufe, geliefert von build/curriculum.py. Ältere gebaute
   Fassungen kennen das Feld nicht; dann bleibt die Liste leer und die
   Einstellung blendet sich aus, statt eine erfundene Zuordnung zu zeigen. */
const KLASSEN = Array.isArray(DATA.klassen) ? DATA.klassen : [];
/* Höchste Stufe. Steht hier oben und nicht erst bei baseStage(), weil schon
   loadState() sie zum Kappen braucht und beim Start früher läuft. */
const MAX_STAGE_ROH = Math.max(...Object.keys(STAGES).map(Number));

const UNITS = {};                       // Schlüssel "skill@stufe" -> Paket
DATA.units.forEach(u => { u.id = u.skill + "@" + u.stage; UNITS[u.id] = u; });
const UNIT_IDS = Object.keys(UNITS);

const skillOf = id => SKILLS.find(s => s.id === id);
const areaOf  = id => AREAS.find(a => a.id === id);
const img = k => IMG[k] || IMG.hero || "";
const avatarImg = pose => AVATAR[pose] || AVATAR.steht || "";

/* Pakete eines Bereichs, aufsteigend nach Stufe – das ist der Weg durch die Welt. */
const unitsOfArea = aid => DATA.units
  .filter(u => (skillOf(u.skill) || {}).area === aid)
  .sort((a, b) => a.stage - b.stage || a.skill.localeCompare(b.skill));

/* ================================================================= Zustand */
const KEY = "mathcraft_v1", DAY = 864e5;
const TITLES = ["Rookie","Zahlenjäger","Rechenprofi","Musterknacker","Logikmeister",
                "Zahlenforscher","Mathe-Ass","Denkmaschine","Großmeister","Legende"];
const INTERVALS = [0, 0, 1, 3, 7, 21];      // Leitner-Abstände in Tagen je Level
const XP_PER_LEVEL = 220;
const XP_FIRST = 10, XP_REDO = 4, XP_LEARN = 2;
const MAX_L = 5;

const BADGES = [
 {id:"first",  e:"🎯", t:"Losgelegt",      d:"Erstes Paket geschafft",           test:s=>s.stats.packs>=1},
 {id:"five",   e:"🚀", t:"Läuft",          d:"5 Pakete geschafft",               test:s=>s.stats.packs>=5},
 {id:"p25",    e:"🧩", t:"Sammler",        d:"25 Pakete geschafft",              test:s=>s.stats.packs>=25},
 {id:"streak3",e:"🔥", t:"Warmgelaufen",   d:"3 Tage hintereinander geübt",      test:s=>s.profile.bestStreak>=3},
 {id:"streak7",e:"⚡", t:"Unaufhaltsam",   d:"7 Tage hintereinander geübt",      test:s=>s.profile.bestStreak>=7},
 {id:"streak30",e:"💎",t:"Diamantserie",   d:"30 Tage hintereinander geübt",     test:s=>s.profile.bestStreak>=30},
 {id:"a100",   e:"🧮", t:"Hundert",        d:"100 Aufgaben richtig gelöst",      test:s=>s.stats.correct>=100},
 {id:"a500",   e:"👑", t:"Rechenkönig",    d:"500 Aufgaben richtig gelöst",      test:s=>s.stats.correct>=500},
 {id:"combo10",e:"🎯", t:"Volltreffer",    d:"10 richtige Antworten in Folge",   test:s=>s.stats.bestCombo>=10},
 {id:"knobel", e:"🧠", t:"Knobelkopf",     d:"25 Knobelaufgaben gelöst",         test:s=>s.stats.knobel>=25},
 {id:"stars30",e:"⭐", t:"Sternenjäger",   d:"30 Sterne gesammelt",              test:s=>totalStars(s)>=30},
 {id:"perfect5",e:"💯",t:"Makellos",       d:"5 Pakete mit 3 Sternen",           test:s=>Object.values(s.units).filter(p=>p.stars===3).length>=5},
 {id:"area1",  e:"🗺️", t:"Weltmeister",    d:"Eine ganze Welt geschafft",
  test:s=>AREAS.some(a=>{const us=unitsOfArea(a.id);return us.length&&us.every(u=>(s.units[u.id]||{}).stars>0)})},
 {id:"alle",   e:"🌍", t:"Entdecker",      d:"In jeder Welt gespielt",
  test:s=>AREAS.every(a=>unitsOfArea(a.id).some(u=>s.units[u.id]))},
 {id:"m25",    e:"🏅", t:"Könner",         d:"25 Fertigkeiten gemeistert",       test:s=>masteredCount(s)>=25},
 {id:"stufe5", e:"🚩", t:"Aufstieg",       d:"Stufe 5 erreicht",                 test:s=>topStage(s)>=5},
];

/* Eine Kennung für dieses Gerät. Zufällig, nicht der Name des Kindes — der
   Dienst muss Ereignisse zuordnen können, aber nichts über ihn wissen.
   Beim Zurücksetzen entsteht eine neue; der alte Strom bleibt dem Dienst
   erhalten, statt sich mit dem neuen zu vermischen. */
function neueGeraeteId(){
  const a = new Uint8Array(8);
  try{ crypto.getRandomValues(a); }
  catch(e){ for(let i=0;i<a.length;i++) a[i] = (Math.random()*256)|0; }
  return Array.from(a, b => b.toString(16).padStart(2,"0")).join("");
}

const WISHES_DONE_MAX = 200; // so viele erfüllte "jetzt"-Wünsche merkt sich das Gerät
const LOG_MAX = 20000;      // Obergrenze des Puffers; 90 Tage passen weit darunter
const LOG_TAGE = 90;        // so lange darf er ohne WLAN sammeln
const H_MAX = 12;           // so viele Antworten je Fertigkeit bleiben im Gedächtnis
const TYP_FENSTER = 200;    // so weit zurück wird die Aufgabenmischung gemessen

const freshState = () => ({
  v:1,
  dev: neueGeraeteId(),
  // einstieg: Stufe, unter die dieses Kind nicht mehr fällt — aus seiner
  // Schulklasse abgeleitet (siehe KLASSEN und baseStage()). 0 heißt: nie
  // gesetzt, dann gilt Stufe 1 wie bisher.
  profile:{name:"", xp:0, streak:0, bestStreak:0, lastDay:0, goal:15, todayDay:0, todayCount:0,
           badges:[], lastUnitId:"", einstieg:0, klasse:0},
  // skillId -> {l:Level, d:fällig ab (ms), c:richtig, w:falsch, h:letzte Antworten}
  // h ist das Kurzzeitgedächtnis: c und w summieren über Monate und verdecken
  // damit genau das, worauf es ankommt — was zuletzt passiert ist.
  skills:{},
  // unitId -> {stars, plays, sofort, pausiertBis, rev}. rev ist die zuletzt
  // gesehene Paket-Fassung (D6.2, siehe pruefeRevisionen()) — nur dazu da, ein
  // inhaltlich ersetztes Paket zu erkennen, kein Lernstand für sich.
  units:{},
  // D6.1: wie oft ein Paket schon vollständig gespielt wurde — steuert den
  // Deckel des Spaß-Signals (siehe SPASS/finishSession()): es fragt höchstens
  // bei jedem zweiten Paketende, abwechselnd.
  spassZaehler:0,
  stats:{packs:0, answers:0, correct:0, knobel:0, bestCombo:0},
  typLog:[],  // die zuletzt vorgelegten Aufgabenarten, für die Mischung
  // D7: modus schaltet in diesem Schritt nur die Sichtbarkeit des Begleiters
  // um (begleiterAktiv()) — die eigentliche Denkschule-Kartenansicht (D1)
  // kommt in einem späteren Schritt dazu. Lernstand bleibt in beiden Modi
  // derselbe: units/skills werden vom Schalter nicht berührt.
  // A: stimme wählt zwischen der Gerätestimme ("system", wie bisher) und
  // einer der drei vorproduzierten Stimmen vom Heim-Dienst — siehe speak()
  // und build/tts_erzeugen.py.
  settings:{sound:true, speech:true, modus:"v2", begleiter:true, stimme:"system"},
  // D5: der Würfelfuchs. Der Name ist ein Freitext des Kindes und bleibt
  // strikt lokal — er darf logEvent()/syncNow() nie erreichen (Z1).
  avatar:{name:"", getauft:false, letzteNachfrageTag:"", nachfrageWarZuletzt:false},
  // Ereignisse, die der Dienst noch nicht bestätigt hat. next zählt monoton
  // weiter, damit eine doppelte Übertragung dort nichts verdoppelt.
  log:{next:1, ev:[], lost:0},
  wishes:[],  // Wünsche der Eltern, kommen mit der Antwort auf /sync
  wishesDone:[], // erfüllte "jetzt"-Wünsche: {ziel,id,t} des erfüllten Wunsches
  plan:[],    // was der Tutor entschieden hat — Elternwunsch geht ihm vor
  server: BUILD.server || ""
});

let S = load();
// pruefeRevisionen() erst NACH den const-Definitionen (save, today) aufrufen —
// es speichert bei geänderten Paket-Fassungen, und ein Aufruf vor der
// Initialisierung von save legt die App bei bestehendem Lernstand komplett lahm.

/* Gespeicherter Stand wird feldweise übernommen und geprüft. Ein beschädigter
   Eintrag darf höchstens Fortschritt kosten, niemals die App lahmlegen. */
function load(){
  const s = freshState();
  const isObj = v => v !== null && typeof v === "object" && !Array.isArray(v);
  const num = (v, def) => (typeof v === "number" && isFinite(v)) ? v : def;
  try{
    const raw = JSON.parse(localStorage.getItem(KEY));
    if(!isObj(raw) || raw.v !== 1) return s;

    if(isObj(raw.skills)) for(const [id, x] of Object.entries(raw.skills)){
      if(!skillOf(id) || !isObj(x)) continue;              // unbekannte IDs verwerfen
      s.skills[id] = {l:Math.max(0, Math.min(MAX_L, num(x.l,0)|0)),
                      d:num(x.d,0), c:num(x.c,0)|0, w:num(x.w,0)|0,
                      h:Array.isArray(x.h) ? x.h.filter(v => v === 0 || v === 1).slice(-H_MAX) : []};
    }
    if(isObj(raw.units)) for(const [id, x] of Object.entries(raw.units)){
      if(!UNITS[id] || !isObj(x)) continue;
      s.units[id] = {stars:Math.max(0, Math.min(3, num(x.stars,0)|0)), plays:num(x.plays,0)|0,
                     // B: Sofort-Abbrüche in Folge und bis wann deshalb pausiert ist
                     sofort:Math.max(0, num(x.sofort,0)|0), pausiertBis:num(x.pausiertBis,0),
                     // D6.2: zuletzt gesehene Paket-Fassung, siehe pruefeRevisionen()
                     rev:(typeof x.rev === "string" && /^[0-9a-f]{1,16}$/.test(x.rev)) ? x.rev : ""};
    }
    if(isObj(raw.stats)) for(const k of Object.keys(s.stats)) s.stats[k] = num(raw.stats[k], 0);
    s.spassZaehler = Math.max(0, num(raw.spassZaehler, 0)|0);

    // Geräte-Id und Ereignispuffer. Ein beschädigter Puffer kostet Messdaten,
    // niemals den Lernstand — deshalb wird er getrennt und großzügig geprüft.
    if(typeof raw.dev === "string" && /^[0-9a-f]{8,32}$/.test(raw.dev)) s.dev = raw.dev;
    if(isObj(raw.log)){
      s.log.lost = Math.max(0, num(raw.log.lost, 0)|0);
      if(Array.isArray(raw.log.ev))
        s.log.ev = raw.log.ev.filter(e => isObj(e) && num(e.i, 0) > 0).slice(-LOG_MAX);
      const hoechste = s.log.ev.reduce((m, e) => Math.max(m, e.i), 0);
      s.log.next = Math.max(1, num(raw.log.next, 1)|0, hoechste + 1);
    }
    if(Array.isArray(raw.wishes)) s.wishes = raw.wishes.filter(isObj).slice(0, 200);
    if(Array.isArray(raw.wishesDone))
      s.wishesDone = raw.wishesDone.filter(isObj).slice(0, WISHES_DONE_MAX);
    if(Array.isArray(raw.plan)) s.plan = raw.plan.filter(isObj).slice(0, 50);
    if(Array.isArray(raw.typLog))
      s.typLog = raw.typLog.filter(v => typeof v === "string").slice(-TYP_FENSTER);
    if(isObj(raw.settings)){
      for(const k of Object.keys(s.settings))
        if(typeof raw.settings[k] === "boolean") s.settings[k] = raw.settings[k];
      // D7: modus ist ein Text, kein Bool — deshalb eigens geprüft. Alles
      // andere als "v1" bleibt beim Standard "v2".
      if(raw.settings.modus === "v1" || raw.settings.modus === "v2")
        s.settings.modus = raw.settings.modus;
      // A: ebenfalls ein Text, keine der vier bekannten Stimmen bleibt beim
      // Standard "system" (Gerätestimme).
      if(["system","zephyr","puck","leda"].includes(raw.settings.stimme))
        s.settings.stimme = raw.settings.stimme;
    }
    if(isObj(raw.avatar)){
      const av = raw.avatar;
      // D5: der Name ist ein Freitext des Kindes — lokal völlig in Ordnung,
      // er verlässt das Gerät nur nie über logEvent()/syncNow().
      s.avatar.name = typeof av.name === "string" ? av.name.slice(0, 18) : "";
      s.avatar.getauft = av.getauft === true;
      s.avatar.letzteNachfrageTag =
        typeof av.letzteNachfrageTag === "string" ? av.letzteNachfrageTag.slice(0, 10) : "";
      s.avatar.nachfrageWarZuletzt = av.nachfrageWarZuletzt === true;
    }
    // Eine von Hand eingetragene Adresse gewinnt gegen die eingebaute – sonst
    // würde ein Neubau die Korrektur des Nutzers wieder überschreiben.
    if(typeof raw.server === "string") s.server = raw.server.slice(0, 60);
    if(isObj(raw.profile)){
      const p = raw.profile;
      Object.assign(s.profile, {
        name: typeof p.name === "string" ? p.name.slice(0,18) : "",
        xp: Math.max(0, num(p.xp,0)), streak: Math.max(0, num(p.streak,0)|0),
        bestStreak: Math.max(0, num(p.bestStreak,0)|0), lastDay: num(p.lastDay,0)|0,
        goal: Math.max(5, Math.min(60, num(p.goal,15)|0)),
        todayDay: num(p.todayDay,0)|0, todayCount: Math.max(0, num(p.todayCount,0)|0),
        lastUnitId: UNITS[p.lastUnitId] ? p.lastUnitId : "",
        // Ein Lernstand von vor dieser Fassung kennt beide Felder nicht. 0
        // bedeutet dann genau das bisherige Verhalten: Einstieg auf Stufe 1.
        einstieg: Math.max(0, Math.min(MAX_STAGE_ROH, num(p.einstieg, 0)|0)),
        klasse: Math.max(0, Math.min(13, num(p.klasse, 0)|0)),
        badges: Array.isArray(p.badges) ? p.badges.filter(b => BADGES.some(x => x.id === b)) : [],
      });
    }
  }catch(e){ return freshState(); }
  return s;
}
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };

/* D6.2: Paket-Fassung (rev). build/build.py hasht den Aufgabeninhalt jedes
   Pakets (8 Hex-Zeichen, siehe rev_von()) und bettet ihn als u.rev ein. Weicht
   die zuletzt gemerkte Fassung eines gespielten Pakets von der eingebauten ab,
   wurde es inhaltlich ersetzt — dann werden NUR seine Sterne auf 0 gesetzt,
   plays/sofort/pausiertBis und das Fertigkeiten-Gedächtnis bleiben unberührt.
   Taucht eine rev zum ersten Mal auf (noch keine gemerkt), wird nur gemerkt,
   nichts zurückgesetzt — sonst verlöre jedes Paket beim allerersten Bau mit
   dieser Funktion scheinbar seinen Fortschritt. Läuft einmal beim Start. */
function pruefeRevisionen(){
  let geaendert = false;
  DATA.units.forEach(u => {
    const x = S.units[u.id];
    if(!x || !u.rev) return;                 // nie gespielt: nichts zu merken
    if(x.rev && x.rev !== u.rev){ x.stars = 0; geaendert = true; }
    if(x.rev !== u.rev){ x.rev = u.rev; geaendert = true; }
  });
  if(geaendert) save();
}

const today = () => Math.floor(Date.now()/DAY);
pruefeRevisionen();
function st(id){
  const x = S.skills[id] || (S.skills[id] = {l:0, d:0, c:0, w:0, h:[]});
  if(!Array.isArray(x.h)) x.h = [];        // Stand aus einer älteren Fassung
  return x;
}
const NOSTATE = Object.freeze({l:0, d:0, c:0, w:0, h:Object.freeze([])});
const stRead = id => S.skills[id] || NOSTATE;
const masteredCount = s => Object.values(s.skills).filter(x => x.l >= MAX_L).length;
const totalStars = s => Object.values(s.units).reduce((a,p) => a + (p.stars||0), 0);
const levelOf = xp => Math.min(10, 1 + Math.floor(xp/XP_PER_LEVEL));
const levelTitle = xp => TITLES[levelOf(xp)-1];

/* Höchste Stufe, auf der schon etwas sitzt – Maßstab für den Fortschritt. */
function topStage(s){
  let top = 1;
  for(const [id, x] of Object.entries(s.skills)){
    const sk = skillOf(id);
    if(sk && x.l >= 3) top = Math.max(top, sk.stage);
  }
  return top;
}

function rollDay(){
  const d = today();
  if(S.profile.todayDay !== d){ S.profile.todayDay = d; S.profile.todayCount = 0; save(); }
}
function touchDay(){
  const d = today(), p = S.profile;
  if(p.lastDay === d) return;
  p.streak = (d - p.lastDay === 1) ? p.streak + 1 : 1;
  p.bestStreak = Math.max(p.bestStreak, p.streak);
  p.lastDay = d;
  if(p.todayDay !== d){ p.todayDay = d; p.todayCount = 0; }
}

/* ================================================================== Effekte */
let AC = null;
function sfx(kind){
  if(!S.settings.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state === "suspended") AC.resume();
    const seq = {right:[[698,0],[932,.08]], near:[[560,0],[560,.1]], wrong:[[320,0],[210,.11]],
      level:[[523,0],[659,.09],[784,.18],[1047,.3]], done:[[784,0],[988,.11],[1319,.24]],
      tap:[[880,0]]}[kind];
    if(!seq) return;
    seq.forEach(([f,t]) => {
      const o = AC.createOscillator(), g = AC.createGain(), at = AC.currentTime + t;
      o.type = "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, at);
      g.gain.exponentialRampToValueAtTime(kind === "tap" ? .06 : .2, at+.02);
      g.gain.exponentialRampToValueAtTime(.0001, at+.22);
      o.connect(g).connect(AC.destination); o.start(at); o.stop(at+.25);
    });
  }catch(e){}
}
const cvs = document.getElementById("cfx"), cx = cvs.getContext("2d");
let parts = [], raf = 0;
function confetti(n){
  cvs.width = innerWidth; cvs.height = innerHeight;
  const cols = ["#25d0c0","#ffb238","#5b8cff","#ff6a4d","#2fd77f","#ff4d94"];
  for(let i=0;i<n;i++) parts.push({x:innerWidth/2+(Math.random()-.5)*300, y:innerHeight*.32,
    vx:(Math.random()-.5)*12, vy:-Math.random()*14-4, s:5+Math.random()*7,
    c:cols[(Math.random()*cols.length)|0], r:Math.random()*6, vr:(Math.random()-.5)*.42});
  if(!raf) raf = requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0,0,cvs.width,cvs.height);
  parts = parts.filter(p => p.y < cvs.height+50);
  parts.forEach(p => {
    p.vy += .4; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r);
    cx.fillStyle = p.c; cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.62); cx.restore();
  });
  raf = parts.length ? requestAnimationFrame(tick) : 0;
}
function toast(m){
  const d = document.createElement("div");
  d.className = "toast"; d.textContent = m; document.body.appendChild(d);
  setTimeout(() => d.remove(), 2800);
}

/* ================================================================= Vorlesen
   Er ist acht und liest noch langsam. Eine Sachaufgabe, die er sich vorlesen
   lassen kann, ist eine Rechenaufgabe – eine, die er entziffern muss, ist eine
   Leseaufgabe. Läuft nativ über Android, im Browser über die Web-Schnittstelle. */
const CAP = window.Capacitor;
const NATIVE = !!(CAP && CAP.isNativePlatform && CAP.isNativePlatform());
const NTTS = NATIVE && CAP.Plugins && CAP.Plugins.TextToSpeech || null;
const WEB_TTS = window.speechSynthesis;
const CAN_SPEAK = !!(NTTS || WEB_TTS);

let VOICE = null;
function pickVoice(){
  if(!WEB_TTS) return;
  const vs = WEB_TTS.getVoices().filter(v => /^de/i.test(v.lang));
  VOICE = vs.find(v => /de[-_]DE/i.test(v.lang)) || vs[0] || null;
}
if(WEB_TTS && !NTTS){ pickVoice(); WEB_TTS.addEventListener("voiceschanged", pickVoice); }

// A: eine gerade abspielende, vorproduzierte Aufnahme (siehe speak() unten) —
// eigens gehalten, damit stopSpeaking() sie genauso beendet wie die Ausgabe
// über NTTS/WEB_TTS. Nur eins von beiden läuft je Kind je Moment.
let AUDIO_CLIP = null;
function stopSpeaking(){
  try{ NTTS ? NTTS.stop() : WEB_TTS && WEB_TTS.cancel(); }catch(e){}
  if(AUDIO_CLIP){
    try{ AUDIO_CLIP.pause(); AUDIO_CLIP.currentTime = 0; }catch(e){}
    AUDIO_CLIP = null;
  }
}

/* ---------------------------------------------------------- A: Audio-Kennung
   crc32 (Tabellenverfahren) über die UTF-8-Bytes des NORMALISIERTEN Textes
   (trim() + jede Whitespace-Folge zu einem Leerzeichen), als 8-stelliger,
   führend genullter Hex-String — vorzeichenlos. Diese Funktion MUSS
   buchstabengetreu mit ihrer Python-Entsprechung in build/tts_erzeugen.py
   (dort: normalisiere()/audio_id(), zlib.crc32) übereinstimmen — beide bilden
   dieselbe Kennung, unter der ein Clip in data/audio/<stimme>/<id>.opus liegt
   bzw. über /audio/<stimme>/<id>.opus ausgeliefert wird (siehe tutor/server.py).
   Ändert sich hier etwas, muss es dort mitgeändert werden, sonst finden
   Vorproduktion und Wiedergabe nie zueinander. */
const CRC32_TABELLE = (() => {
  const t = new Uint32Array(256);
  for(let n = 0; n < 256; n++){
    let c = n;
    for(let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
const normalisiereVorlesetext = s => String(s).trim().replace(/\s+/g, " ");
function audioId(text){
  const bytes = new TextEncoder().encode(normalisiereVorlesetext(text));
  let crc = 0xFFFFFFFF;
  for(let i = 0; i < bytes.length; i++) crc = CRC32_TABELLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  crc = (crc ^ 0xFFFFFFFF) >>> 0;
  return crc.toString(16).padStart(8, "0");
}

/* Die bisherige Ausgabe über die Gerätestimme — unverändert, nur jetzt eine
   eigene Funktion: speak() (unten) versucht bei einer gewählten Stimme zuerst
   eine vorproduzierte Aufnahme und fällt hierauf nur zurück. */
function speakSystem(text){
  try{
    if(NTTS) NTTS.speak({text:String(text), lang:"de-DE", rate:.92, pitch:1, category:"ambient"});
    else if(WEB_TTS){
      const u = new SpeechSynthesisUtterance(String(text));
      if(VOICE) u.voice = VOICE;
      u.lang = VOICE ? VOICE.lang : "de-DE";
      u.rate = .9; u.pitch = 1;
      WEB_TTS.speak(u);
    }
  }catch(e){}
}

/* A: mit gewählter Stimme (S.settings.stimme ≠ "system") und bekanntem Dienst
   erst eine vorproduzierte Aufnahme versuchen (build/tts_erzeugen.py hat sie
   unter genau dieser Kennung abgelegt); klappt das nicht — kein Dienst, kein
   Netz gerade, die Aufnahme fehlt noch (404), ein Abspielfehler —, fällt es
   nahtlos auf die Gerätestimme zurück. Ohne WLAN erst gar nicht erst
   versuchen: navigator.onLine ist zwar nur eine Vermutung des Browsers, erspart
   aber den sinnlosen Umweg über einen Server, der ohnehin nicht zu erreichen ist. */
/* Geladene Clips als Objekt-URLs, damit ein zweites Vorlesen desselben Textes
   nicht erneut übers Netz muss. Klein gedeckelt — ältester Eintrag fliegt. */
const AUDIO_URLS = new Map();
const AUDIO_URLS_MAX = 60;

function speak(text){
  if(!S.settings.speech || !text) return;
  stopSpeaking();
  if(S.settings.stimme !== "system" && S.server && navigator.onLine !== false){
    const url = serverUrl(`/audio/${S.settings.stimme}/${audioId(text)}.opus`);
    if(url){
      // Der Clip wird per fetch geholt und als lokaler Blob abgespielt, NICHT
      // direkt über ein Audio-Element mit http-Adresse: Im Android-WebView
      // blieb das Audio-Element stumm, ohne dass je eine Anfrage das Gerät
      // verließ (Befund 03.09.2026, Dienst-Log leer) — fetch dagegen nimmt
      // denselben nativen Weg wie Sync und Update und kommt nachweislich an.
      const kennung = `${S.settings.stimme}/${audioId(text)}`;
      const meins = {};                 // markiert: dieser speak-Aufruf ist noch aktuell
      AUDIO_CLIP = meins;
      const zurueckfallen = () => { if(AUDIO_CLIP === meins){ AUDIO_CLIP = null; speakSystem(text); } };
      const spielen = objUrl => {
        if(AUDIO_CLIP !== meins) return;          // inzwischen kam ein neuer Aufruf
        const clip = new Audio(objUrl);
        AUDIO_CLIP = clip;
        clip.onerror = () => { if(AUDIO_CLIP === clip){ AUDIO_CLIP = null; speakSystem(text); } };
        try{ clip.play().catch(() => clip.onerror()); }catch(e){ clip.onerror(); }
      };
      if(AUDIO_URLS.has(kennung)){ spielen(AUDIO_URLS.get(kennung)); return; }
      fetch(url, {cache:"force-cache"})
        .then(r => { if(!r.ok) throw new Error("Antwort " + r.status); return r.blob(); })
        .then(b => {
          const objUrl = URL.createObjectURL(b);
          AUDIO_URLS.set(kennung, objUrl);
          if(AUDIO_URLS.size > AUDIO_URLS_MAX){
            const alt = AUDIO_URLS.keys().next().value;
            URL.revokeObjectURL(AUDIO_URLS.get(alt)); AUDIO_URLS.delete(alt);
          }
          spielen(objUrl);
        })
        .catch(zurueckfallen);
      return;
    }
  }
  speakSystem(text);
}

/* ================================================================== Update
   Die App wird weiterentwickelt; eine APK jedes Mal per Kabel aufs Handy zu
   schieben, hält niemand durch. Der Heim-Dienst sagt auf Anfrage, was
   bereitsteht — heruntergeladen und installiert wird über Android selbst,
   damit die App keine Rechte braucht, die sie sonst nie benutzt. */
let UPD = {stand:"", info:null, laeuft:false};

/* Die eigene Fassung. In der App kennt Android sie genau, im Browser steht
   sie aus dem Bau drin. */
let MEINE = {code:BUILD.code, name:BUILD.name};
async function readVersion(){
  const P = (window.Capacitor && Capacitor.Plugins) || {};
  if(!P.App || !P.App.getInfo) return;
  try{
    const i = await P.App.getInfo();
    MEINE = {code:Number(i.build) || BUILD.code, name:i.version || BUILD.name};
