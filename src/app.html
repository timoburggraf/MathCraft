       ${readBtn(hinweisSaetze.join(" "))}
     </div>` +
    denkhilfeHtml(t) +
    `<div class="q" style="padding:16px 0 4px">
       <div class="word${String(t.frage_text||"").length > 60 ? " sm" : ""}">${esc(t.frage_text||"")}</div>
       ${readBtn(t.frage_text || "")}
     </div>
     <div class="opts">` + rows.map(r =>
        `<button class="opt${SESS.answered ? (r.i === t.richtig ? " right" : " wrong") : ""}"
          ${SESS.answered?"disabled":""} onclick="chooseLogik(${r.i})">
          <span class="muted" style="font-weight:800;margin-right:9px">${r.i+1}</span>${esc(r.o)}</button>`
      ).join("") + `</div>` +
    (SESS.answered ? feedback(t, `Richtig ist <b>${esc(t.optionen[t.richtig])}</b>.`) + contBtn() : "");
}

/* ============================================== Roboter (SPEC §2, D2 algo)
   Drei Modi (t.modus): "ziel" (Programm gegeben, Zielfeld im Gitter tippen),
   "programm" (aus einer Palette selbst ein Programm bauen) und "reparieren"
   (den einen falschen Befehl in einem gegebenen Programm antippen).

   Die Simulation ist reine Wahrheit — sie wird gegen den Python-Kern geprüft,
   deshalb exakt nach SPEC §2: Richtungsvektoren, absolut/relativ, Crash-Regel,
   flach aufgelöste Schleifen. */
const ROB_VEKTOR = {N:[-1, 0], O:[0, 1], S:[1, 0], W:[0, -1]};
const ROB_LINKS  = {N:"W", W:"S", S:"O", O:"N"};   // 'L': gegen den Uhrzeigersinn
const ROB_RECHTS = {N:"O", O:"S", S:"W", W:"N"};   // 'R': im Uhrzeigersinn
const ROB_SYMBOL = {N:"⬆", O:"➡", S:"⬇", W:"⬅", V:"⬆", L:"↰", R:"↱"};
const ROB_WORT   = {N:"nach oben", O:"nach rechts", S:"nach unten", W:"nach links",
                    V:"vor", L:"links drehen", R:"rechts drehen"};
const ROB_ZAHLWORT = {2:"zweimal", 3:"dreimal", 4:"viermal"};

/* Schleifen {x:k, b:[...]} flach auflösen — der Körper k-mal hintereinander.
   Ohne verschachtelte Schleifen laut SPEC, die Rekursion schadet trotzdem
   nicht, falls doch einmal eine vorkäme. */
function robFlach(programm){
  const out = [];
  (programm || []).forEach(b => {
    if(b && typeof b === "object" && Array.isArray(b.b))
      for(let i = 0; i < b.x; i++) out.push(...robFlach(b.b));
    else out.push(b);
  });
  return out;
}

/* Führt ein (schon flaches oder noch verschachteltes) Programm Schritt für
   Schritt aus und liefert JEDEN erreichten Zustand — auch den Start als
   ersten Eintrag. Drehungen (L/R) bewegen nicht und erzeugen keinen neuen
   Eintrag. Ein Zug auf eine Wand oder aus dem Gitter bricht sofort ab, ohne
   den Zustand dieses letzten Zuges zu übernehmen (Crash-Regel SPEC §2).
   Basis sowohl für simuliereRoboter() als auch für die Ablauf-Animation. */
function robSchritte(t, programm){
  const wand = new Set((t.waende || []).map(([r, c]) => r + "_" + c));
  let r = t.start[0], c = t.start[1], richtung = t.richtung;
  const zustaende = [{r, c, richtung}];
  let crash = false;
  for(const b of robFlach(programm)){
    if(b === "L"){ richtung = ROB_LINKS[richtung]; continue; }
    if(b === "R"){ richtung = ROB_RECHTS[richtung]; continue; }
    const ziel = b === "V" ? richtung : b;      // 'V' bewegt in Blickrichtung
    const [dr, dc] = ROB_VEKTOR[ziel];
    const neuR = r + dr, neuC = c + dc;
    if(neuR < 0 || neuR >= t.n || neuC < 0 || neuC >= t.n || wand.has(neuR + "_" + neuC)){
      crash = true;
      break;
    }
    r = neuR; c = neuC; richtung = ziel;
    zustaende.push({r, c, richtung});
  }
  return {zustaende, crash};
}

/* Simulationssemantik exakt nach SPEC §2: {pfad, ende, richtung, crash}. */
function simuliereRoboter(t, programm){
  const {zustaende, crash} = robSchritte(t, programm);
  const letzter = zustaende[zustaende.length - 1];
  return {pfad: zustaende.map(z => [z.r, z.c]), ende: [letzter.r, letzter.c],
          richtung: letzter.richtung, crash};
}

/* Befehle als Worte, für Vorlesetext UND Rückmeldungstext — Schleifen bleiben
   als Gruppe erkennbar ("dreimal: vor, vor, rechts drehen"), statt komplett
   flach vorgelesen zu werden. */
function robWorte(programm){
  return (programm || []).map(b => {
    if(b && typeof b === "object" && Array.isArray(b.b))
      return (ROB_ZAHLWORT[b.x] || (b.x + "-mal")) + ": " + robWorte(b.b);
    return ROB_WORT[b] || "";
  }).join(", ");
}

/* q + "Das Programm: " + Befehle als Worte — im programm-Modus gibt es kein
   vorgegebenes Programm, dort bleibt es bei q allein. */
function roboterVorlesetext(t){
  if(t.modus === "programm") return t.q;
  return t.q + " Das Programm: " + robWorte(t.programm) + ".";
}

/* Der Roboter als Inline-SVG-Chevron, per rotate() in Blickrichtung gedreht
   (N 0°, O 90°, S 180°, W 270° — SPEC §2/§9). */
const ROB_WINKEL = {N:0, O:90, S:180, W:270};
function robChevron(richtung){
  return `<svg class="rob-fig" viewBox="0 0 24 24" style="transform:rotate(${ROB_WINKEL[richtung]}deg)">
      <path d="M12 3 L20 19 L12 15 L4 19 Z" fill="currentColor"/>
    </svg>`;
}

/* Das Gitter: Wände 🧱, Ziel ⭐ (fehlt t.ziel — Modus "ziel" — bleibt es leer,
   sonst würde es die Antwort verraten), Startfeld dezent markiert, der
   Roboter an seiner aktuellen Position (Startfeld ohne Animation, sonst der
   laufende Schritt aus SESS.anim). opts.tapbar macht die Felder antippbar
   (nur Modus "ziel", siehe pickRoboterZelle()). */
function robGrid(t, opts){
  opts = opts || {};
  const wand = new Set((t.waende || []).map(([r, c]) => r + "_" + c));
  const zustand = SESS.anim ? SESS.anim.zustaende[SESS.anim.schritt]
    : {r: t.start[0], c: t.start[1], richtung: t.richtung};
  let html = "";
  for(let r = 0; r < t.n; r++){
    for(let c = 0; c < t.n; c++){
      const istWand = wand.has(r + "_" + c);
      const istZiel = t.ziel && t.ziel[0] === r && t.ziel[1] === c;
      const istStart = t.start[0] === r && t.start[1] === c;
      const istRoboter = zustand.r === r && zustand.c === c;
      let cls = "rob-cell" + (istWand ? " wall" : "") + (istStart && !istRoboter ? " start" : "");
      if(opts.tapbar && SESS.answered){
        // Modus "ziel" hat kein t.ziel (das würde die Antwort verraten) —
        // das richtige Feld kommt hier über opts.ende (Simulationsergebnis).
        if(opts.ende && opts.ende[0] === r && opts.ende[1] === c) cls += " right";
        else if(SESS.chosen === r * 100 + c) cls += " wrong";
      }
      const inhalt = istRoboter ? robChevron(zustand.richtung)
        : istWand ? "🧱" : istZiel ? "⭐" : "";
      html += opts.tapbar
        ? `<button class="${cls}" onclick="pickRoboterZelle(${r},${c})"
             ${SESS.answered || istWand ? "disabled" : ""}>${inhalt}</button>`
        : `<div class="${cls}">${inhalt}</div>`;
    }
  }
  return `<div class="rob-grid" style="grid-template-columns:repeat(${t.n},auto)">${html}</div>`;
}

/* Read-only Zeile der Programm-Symbole (Modus "ziel" und Rückmeldung im
   Modus "programm"), Schleifen als "3×( … )"-Gruppe. */
function robProgrammLesen(programm){
  const teil = b => (b && typeof b === "object" && Array.isArray(b.b))
    ? `<span class="rob-loop">${b.x}×(${b.b.map(teil).join("")})</span>`
    : `<span class="rob-chip">${ROB_SYMBOL[b] || "?"}</span>`;
  return `<div class="rob-prog">${(programm || []).map(teil).join("")}</div>`;
}

/* Antippbare Befehls-Chips im Modus "reparieren", mit sichtbarer Nummer.
   t.programm ist dort laut SPEC immer flach (keine Schleife). */
function robProgrammChips(t){
  return `<div class="rob-prog">` + t.programm.map((b, i) => {
    let cls = "rob-chip tap";
    if(SESS.answered){
      if(i === t.loesung.index) cls += " right";
      else if(i === SESS.chosen) cls += " wrong";
    }
    return `<button class="${cls}" onclick="tapBefehl(${i})" ${SESS.answered ? "disabled" : ""}>
        <span class="rob-nr">${i + 1}</span>${ROB_SYMBOL[b] || "?"}</button>`;
  }).join("") + `</div>`;
}

/* ---- Modus "ziel": Gitterfeld antippen, an dem der Roboter hält ---- */
function pickRoboterZelle(r, c){
  if(SESS.answered) return;
  const t = curTask();
  SESS.chosen = r * 100 + c;
  // Kein Fehler erreicht das Kind: gewertet wird über die Simulation, nicht
  // über einen Textvergleich (Leitplanke §0.2). Modus "ziel" crasht laut
  // Kern-Garantie nie, "ende" ist also immer erreichbar.
  const erg = simuliereRoboter(t, t.programm);
  starteRoboterAnimation(t.programm);   // Zustand VOR grade(), damit der erste Render schon passt
  grade(r === erg.ende[0] && c === erg.ende[1]);
}
function qRoboterZiel(t){
  // Nur für die Grün-Markierung nach der Antwort — t.ziel gibt es hier nicht.
  const erg = simuliereRoboter(t, t.programm);
  return head(t) +
    `<div class="rob-progwrap">${robProgrammLesen(t.programm)}
       ${readBtn("Das Programm: " + robWorte(t.programm))}</div>` +
    robGrid(t, {tapbar:true, ende:erg.ende}) +
    (SESS.answered ? feedback(t, "Er hält auf dem grünen Feld.") + contBtn() : "");
}

/* ---- Modus "programm": aus der Palette ein eigenes Programm bauen ---- */
function tapPalette(cmd){
  if(SESS.answered) return;
  const t = curTask();
  if(SESS.prog.length >= t.max_laenge) return;
  sfx("tap");
  SESS.prog.push(cmd);
  render();
}
function leerProgramm(){
  if(SESS.answered) return;
  SESS.prog = [];
  render();
}
function startRoboterProgramm(){
  if(SESS.answered || !SESS.prog.length) return;
  const t = curTask();
  const prog = SESS.prog.slice();
  const erg = simuliereRoboter(t, prog);
  starteRoboterAnimation(prog);
  grade(!erg.crash && erg.ende[0] === t.ziel[0] && erg.ende[1] === t.ziel[1]
        && prog.length <= t.max_laenge);
}
function qRoboterProgramm(t){
  const palette = t.befehlssatz === "absolut" ? ["N", "O", "S", "W"] : ["V", "L", "R"];
  const voll = SESS.prog.length >= t.max_laenge;
  const zeile = Array.from({length: t.max_laenge}, (_, i) =>
    `<div class="rob-slot${i < SESS.prog.length ? " set" : ""}">${
      i < SESS.prog.length ? ROB_SYMBOL[SESS.prog[i]] : ""}</div>`).join("");
  return head(t) +
    robGrid(t, {tapbar:false}) +
    `<div class="rob-zeile">${zeile}</div>
     <div class="rob-palette">` + palette.map(cmd =>
        `<button class="rob-pal" onclick="tapPalette('${cmd}')" ${SESS.answered || voll ? "disabled" : ""}>
           ${ROB_SYMBOL[cmd]}<span>${ROB_WORT[cmd]}</span></button>`
      ).join("") + `</div>
     <div class="row" style="margin-top:10px">
       <button class="btn grow" onclick="leerProgramm()" ${SESS.answered ? "disabled" : ""}>↺</button>
       <button class="btn primary grow" onclick="startRoboterProgramm()"
         ${SESS.answered || !SESS.prog.length ? "disabled" : ""}>▶ Los</button>
     </div>` +
    (SESS.answered ? feedback(t, "Ein möglicher Weg: " + robProgrammLesen(t.loesung.beispiel)) + contBtn() : "");
}

/* ---- Modus "reparieren": den falschen Befehl antippen ---- */
function tapBefehl(i){
  if(SESS.answered) return;
  const t = curTask();
  SESS.chosen = i;
  const repariert = t.programm.slice();
  repariert[t.loesung.index] = t.loesung.ersatz;
  starteRoboterAnimation(repariert);
  grade(i === t.loesung.index);
}
function qRoboterReparieren(t){
  const ersatz = t.loesung.ersatz;
  const loesungText = `Richtig ist Platz <b>${t.loesung.index + 1}</b>: dort muss
    <b>${ROB_SYMBOL[ersatz]} „${esc(ROB_WORT[ersatz])}“</b> stehen.`;
  return head(t) +
    robGrid(t, {tapbar:false}) +
    robProgrammChips(t) +
    (SESS.answered ? feedback(t, loesungText) + contBtn() : "");
}

/* ---- Ablauf-Animation: läuft nach jeder Antwort den Pfad ab (SPEC §9).
   Zustand in SESS.anim/{SESS.animTimer}; nextTask()/quitSession() brechen
   einen laufenden Timer ab (stopRoboterAnimation()), damit er nicht in eine
   andere Aufgabe hineinzeichnet. Bei REDUCED_MOTION springt er sofort ans
   Ende, statt Schritt für Schritt zu laufen. ---- */
function stopRoboterAnimation(){
  if(SESS && SESS.animTimer){ clearTimeout(SESS.animTimer); SESS.animTimer = null; }
}
function starteRoboterAnimation(programm){
  const t = curTask();
  const {zustaende} = robSchritte(t, programm);
  stopRoboterAnimation();
  SESS.anim = {zustaende, schritt: REDUCED_MOTION ? zustaende.length - 1 : 0};
  if(REDUCED_MOTION || zustaende.length <= 1) return;
  const weiter = () => {
    if(!SESS || !SESS.anim) return;
    if(SESS.anim.schritt >= SESS.anim.zustaende.length - 1){ SESS.animTimer = null; return; }
    SESS.anim.schritt++;
    render();
    SESS.animTimer = setTimeout(weiter, 280);
  };
  SESS.animTimer = setTimeout(weiter, 280);
}

function qRoboter(t){
  if(t.modus === "ziel") return qRoboterZiel(t);
  if(t.modus === "programm") return qRoboterProgramm(t);
  return qRoboterReparieren(t);
}

/* ==================================== Bildwahl (SPEC §3: Spiegeln, Drehen,
   Bildmatrix, Analogie) — ein Fragebild, darunter vier Optionsbilder. */
function chooseBild(i){
  if(SESS.answered) return;
  SESS.chosen = i;
  grade(i === curTask().richtig);
}
/* Die Analogie liefert ein breites Fragebild (A -> B, C -> ?, viewBox z. B.
   0 0 1002 240) — bei 62% Breite würde es winzig. Erkannt wird das aus der
   viewBox des SVG selbst (Breite > Höhe), nicht aus kern.art: der Renderer
   soll nicht wissen müssen, welche Kern-Art dahintersteckt. Quadratische
   Fragebilder (Spiegeln, Drehen, Matrix) bleiben bei 62%. */
function bwIstBreit(svg){
  const m = /viewBox\s*=\s*["']\s*[\d.\-]+\s+[\d.\-]+\s+([\d.]+)\s+([\d.]+)/.exec(svg || "");
  return !!m && parseFloat(m[1]) > parseFloat(m[2]);
}
function qBildwahl(t){
  const karten = t.optionen_svg.map((svg, i) => {
    let cls = "bw-opt";
    if(SESS.answered){
      if(i === t.richtig) cls += " right";
      else if(i === SESS.chosen) cls += " wrong";
    }
    return `<button class="${cls}" ${SESS.answered ? "disabled" : ""} onclick="chooseBild(${i})">${svg}</button>`;
  }).join("");
  return head(t) +
    `<div class="bw-frage${bwIstBreit(t.svg) ? " breit" : ""}">${t.svg}</div>
     <div class="bw-grid">${karten}</div>` +
    (SESS.answered ? feedback(t, "Das grün umrandete Bild ist richtig.") + contBtn() : "");
}

/* ============================================ Bildzahl (SPEC §4: Würfelgebäude)
   Wie qZahl (Ziffernfeld, checkZahl()), nur mit dem Bild über dem Anzeigefeld —
   kein Rechenterm, der Kern ist die Wahrheit (a). */
function qBildzahl(t){
  const cls = SESS.answered ? (SESS.lastOk ? "right" : "wrong") : "";
  return head(t) +
    `<div class="bw-frage">${t.svg}</div>` +
    display(cls) +
    (SESS.answered
      ? feedback(t, `Richtig ist <b>${fmtNum(t.a)}</b>.`) + contBtn()
      : numpad("checkZahl()"));
}

/* ==================================== Positionen (SPEC §6: Logik ohne Zahlen)
   Gleiche Hülle wie qLogikgitter: Rahmen, nummerierte Hinweise, eine eigene
   Denkhilfe (Namen × Positionen statt Kategorien) und die Antwort als große
   Knöpfe. */
function positionenVorlesetext(t){
  const rahmen = t.rahmen || (SESS && SESS.intro) || "";
  const hinweise = (t.hinweise || []).map(h => h.text).join(" ");
  return [rahmen, hinweise, t.frage_text || ""].filter(Boolean).join(" ");
}

/* Spaltenköpfe der Denkhilfe: "ganz links", "2.", "3.", …, "ganz rechts". */
function positionenSpalten(n){
  return Array.from({length: n}, (_, p) =>
    p === 0 ? "ganz links" : p === n - 1 ? "ganz rechts" : (p + 1) + ".");
}

/* Eigene Denkhilfe-Tabelle für Positionen (Namen × Positionsspalten) — nutzt
   dieselben dh-*-Klassen, dieselbe Zell-Mechanik (tapDenkzelle/denkzelleZeichen)
   und denselben Auf/Zu-Knopf wie denkhilfeHtml(), nur mit anderem Kopf und
   Schlüssel `${s}_${p}` statt `${r}_${kat}_${idx}`. */
function denkhilfePositionenHtml(t){
  const n = t.namen.length;
  const spalten = positionenSpalten(n);
  const kopf = `<th></th>` + spalten.map(s => `<th>${esc(s)}</th>`).join("");
  const zeilen = t.namen.map((name, s) => {
    const zellen = spalten.map((_, p) => {
      const schluessel = `${s}_${p}`;
      const v = (SESS.denk || {})[schluessel] || 0;
      const cls = v === 1 ? " ja" : v === 2 ? " nein" : "";
      return `<td><button class="dh-cell${cls}" onclick="tapDenkzelle('${schluessel}')">
        ${denkzelleZeichen(v)}</button></td>`;
    }).join("");
    return `<tr><th>${esc(name)}</th>${zellen}</tr>`;
  }).join("");
  return `<div class="denkhilfe">
      <button class="dh-toggle" onclick="toggleDenkhilfe()">
        ${SESS.denkOffen ? "▲ Denkhilfe verbergen" : "▼ Denkhilfe zum Mitnotieren"}</button>
      ${SESS.denkOffen ? `<div class="dh-scroll"><table class="dh-table">
          <thead><tr>${kopf}</tr></thead><tbody>${zeilen}</tbody></table></div>
        <div class="muted" style="font-size:12.5px;margin-top:7px">
          Nur zum Merken – zählt nicht mit.</div>` : ""}
    </div>`;
}

function choosePosition(i){
  if(SESS.answered) return;
  SESS.chosen = i;
  grade(i === curTask().richtig);
}
function qPositionen(t){
  const rahmen = t.rahmen || SESS.intro || "";
  const hinweisSaetze = (t.hinweise || []).map(h => h.text);
  const rows = (t.optionen || []).map((o, i) => ({o, i}))
    .filter(r => !SESS.answered || r.i === t.richtig || r.i === SESS.chosen);
  const reihenfolge = (t.loesung || []).map(s => esc(t.namen[s])).join(" · ");

  return (rahmen ? `<div class="story">${esc(rahmen)} ${readBtn(rahmen)}</div>` : "") +
    `<div class="hlwrap">
       <div class="eyebrow">Hinweise</div>
       <ol class="hlist">${hinweisSaetze.map(s => `<li>${esc(s)}</li>`).join("")}</ol>
       ${readBtn(hinweisSaetze.join(" "))}
     </div>` +
    denkhilfePositionenHtml(t) +
    `<div class="q" style="padding:16px 0 4px">
       <div class="word${String(t.frage_text||"").length > 60 ? " sm" : ""}">${esc(t.frage_text||"")}</div>
       ${readBtn(t.frage_text || "")}
     </div>
     <div class="opts">` + rows.map(r =>
        `<button class="opt${SESS.answered ? (r.i === t.richtig ? " right" : " wrong") : ""}"
          ${SESS.answered?"disabled":""} onclick="choosePosition(${r.i})">
          <span class="muted" style="font-weight:800;margin-right:9px">${r.i+1}</span>${esc(r.o)}</button>`
      ).join("") + `</div>` +
    (SESS.answered ? feedback(t, `Richtig ist <b>${esc(t.optionen[t.richtig])}</b>.
        Von links nach rechts: ${reihenfolge}.`) + contBtn() : "");
}

/* ------------------------------------------------------------- Ergebnisbild */
VIEWS.result = function(){
  const r = view.opts.res || {stars:1, pct:0, right:0, asked:0, title:""};
  const s = "★".repeat(r.stars) + `<span class="off">${"★".repeat(3-r.stars)}</span>`;
  const wort = r.stars === 3 ? "Perfekt gemacht!" : r.stars === 2 ? "Gut gemacht!" : "Geschafft!";
  const nu = nextUnit();
  return `<div class="hero" style="height:200px">
      <img src="${img(r.stars >= 3 ? "win" : "levelup")}" alt="">
      <div class="on" style="justify-content:flex-end">
        <div><div class="eyebrow" style="color:rgba(255,255,255,.85)">Fertig</div>
        <h1 style="font-size:24px">${esc(r.title)}</h1></div>
      </div>
    </div>
    <div class="card center" style="margin-bottom:12px">
      <div class="stars">${s}</div>
      <h2>${wort}</h2>
      <div class="muted">${r.right} von ${r.asked} auf Anhieb richtig${
        r.asked ? " · " + r.pct + "%" : ""}</div>
      ${r.aufstieg ? `<div class="tip" style="text-align:center;margin-top:12px">
        🔥 Das saß. Ab jetzt wird es schwerer — <b>Schwierigkeit ${r.aufstieg}:
        ${esc(STAGES[r.aufstieg] || "")}</b></div>` : ""}
      <div class="grid3" style="margin-top:14px">
        <div class="stat"><b>${S.profile.xp}</b><span class="muted">XP</span></div>
        <div class="stat"><b>${totalStars(S)}</b><span class="muted">Sterne</span></div>
        <div class="stat"><b>${S.profile.streak}</b><span class="muted">Tage</span></div>
      </div>
    </div>
    ${!r.spassFragen ? "" : r.spassAntwort ? `<div class="muted center" style="margin-bottom:9px;
        font-size:14.5px">${esc(gefName())} sagt: Danke dir!</div>` : `
      <div class="card center" style="margin-bottom:9px;padding:14px">
        <div style="font-size:14.5px;margin-bottom:9px">Wie fandst du das?</div>
        <div class="row" style="justify-content:center;gap:16px">
          <button class="btn" style="font-size:27px;padding:9px 16px" onclick="gibSpassFeedback(1)">🙁</button>
          <button class="btn" style="font-size:27px;padding:9px 16px" onclick="gibSpassFeedback(2)">😐</button>
          <button class="btn" style="font-size:27px;padding:9px 16px" onclick="gibSpassFeedback(3)">😄</button>
        </div>
      </div>`}
    <button class="btn primary wide" style="margin-bottom:9px" id="cont"
      onclick="startNext()">▶ Weiter: ${esc(nu.title)}</button>
    <div class="row">
      <button class="btn grow" onclick="go('map')">🗺️ Karte</button>
      <button class="btn grow" onclick="go('home')">🏠 Start</button>
    </div>`;
};
</script>

<script>
/* ================================================================ Würfelfuchs
   Der Begleiter aus D5/D7 (ZIELE-V2.md). Lebt in #gefroot, einem eigenen
   Container außerhalb des Routers, damit er über jeden Bildschirmwechsel
   hinweg an Ort und Stelle bleibt und seine Zeitgeber weiterlaufen, während
   render() #app austauscht. renderGef() wird darum am Ende von render()
   aufgerufen (siehe dort) — nie vom Router selbst.

   Er ist ehrlich: ein schlauer Computer-Tutor, kein Mensch und kein echtes
   Tier — das steht wörtlich in seiner Vorstellung (gefTaufeHtml()). Er übt
   keinen Druck aus: kein Hunger, kein Verkümmern, kein Verlust bei Pausen —
   wer lange nicht spielt, findet ihn beim nächsten Mal einfach wieder vor. */
const REDUCED_MOTION = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);

// Laufzeit-Zustand, bewusst NICHT gespeichert — nach einem Neuladen fängt die
// Anwesenheit frisch an, nur getauft/Name (in S.avatar) bleiben erhalten.
// Stellschrauben des Eigenlebens an einer Stelle — gef_animation_test.py
// verkürzt sie direkt, statt echte Minuten abzuwarten (Playwright gegen die
// gebaute index.html darf nicht minutenlang laufen).
const GEF_ZEIT = {
  blinkMin:4000, blinkSpanne:4000,           // Blinzeln alle 4–8 s
  gesteMin:30000, gesteSpanne:30000,         // kurze Geste alle 30–60 s
  streifzugMin:120000, streifzugSpanne:180000, // Streifzug alle 2–5 min
  draussenMin:30000, draussenSpanne:60000,   // unsichtbare Wartezeit draußen, 30–90 s
  laufDauerMin:6000, laufDauerSpanne:3000,   // Gleit-Transition zum Rand, 6–9 s
  laufTakt:180,                              // Wechsel laeuft1/laeuft2 beim Gehen
  schnuppertZurueck:2000,                    // Schnuppern nach der Rückkehr
  ruheBisSchlaf:60000,                       // Ruhe, bevor das Gähnen beginnt
  gaehntDauer:1800,                          // gähnt, bevor er wirklich einschläft
  wachBlinzeln:500                           // Blinzeln beim Aufwachen
};

let GEF = {
  taufeSpaeter:false,          // "Später" getippt — Dialog erst beim nächsten Start wieder
  nameSpaeter:false,           // dito, für die Namensfrage VOR der Fuchs-Taufe
  nachfrage:null,              // {unitId} — eine Abbruch-Nachfrage wartet auf Antwort
  blase:false, blaseText:null, blaseTimer:0,
  pose:"steht", schlaeft:false, draussen:false,
  reaktion:null, reaktionBis:0,   // kurze Erfolgspose, siehe finishSession()/checkBadges()
  wachAb:Date.now(),
  naechsterBlink:0, naechsteGeste:0, naechsterStreifzug:0, zurueckUm:0,
  // Sichtbarer Spaziergang (a): laufPhase ist "raus"/"zurueck" während der
  // Gleit-Transition, draussen bleibt wie bisher die unsichtbare Wartezeit
  // dazwischen. laufTimer wechselt dabei die Gehpose im Takt, laufEndeTimer
  // markiert das Ende der jeweiligen Gleit-Transition.
  laufPhase:null, laufRichtung:0, laufDauer:0, laufTimer:0, laufEndeTimer:0,
  // Schlafen-/Aufwach-Sequenz (b, c)
  gaehnTimer:0, wachBlinzelTimer:0
};

function planeGefZeiten(jetzt){
  GEF.naechsterBlink = jetzt + GEF_ZEIT.blinkMin + Math.random()*GEF_ZEIT.blinkSpanne;
  GEF.naechsteGeste  = jetzt + GEF_ZEIT.gesteMin + Math.random()*GEF_ZEIT.gesteSpanne;
  GEF.naechsterStreifzug = jetzt + GEF_ZEIT.streifzugMin + Math.random()*GEF_ZEIT.streifzugSpanne;
}
planeGefZeiten(Date.now());

// 9: Begleiter aus (per V1 oder per Schalter) heißt wirklich AUS — keine
// Präsenz, keine Sprechblase, keine Taufe, keine Nachfrage.
function begleiterAktiv(){ return S.settings.modus === "v2" && S.settings.begleiter; }
// D5: auf einem Aufgaben-Screen ist er ausgeblendet — die kurze Erfolgspose
// aus Punkt 7 zeigt sich erst wieder auf dem (nicht-session) Ergebnis-Screen.
function begleiterSchirm(){ return view.name !== "session"; }
// Vor der Fuchs-Taufe fragt die App (Elternwunsch 02.09.2026) einmal nach dem
// Spielernamen — nur bei einem wirklich frischen Gerät (Fuchs noch nicht
// getauft). Bestandsgeräte, die den Fuchs schon getauft haben, aber noch
// keinen Spielernamen eingetragen haben, bekommen diesen Dialog NICHT — für
// sie gibt es das Namensfeld in den Einstellungen. gefTaufeOffen() bleibt
// absichtlich unabhängig davon (bleibt "die Taufe steht noch aus") — allein
// die Reihenfolge in renderGef() sorgt dafür, dass der Namensdialog zuerst
// erscheint.
function gefNameOffen(){
  return begleiterAktiv() && begleiterSchirm() && !S.avatar.getauft
       && !S.profile.name && !GEF.nameSpaeter;
}
function gefTaufeOffen(){
  return begleiterAktiv() && begleiterSchirm() && !S.avatar.getauft && !GEF.taufeSpaeter;
}
const gefName = () => (S.avatar.getauft && S.avatar.name) ? S.avatar.name : "dein Fuchs";

/* Jeder Tipp irgendwo weckt ihn — "Tipp weckt ihn". c) Aufwachen ist eine
   kurze Sequenz: erst blinzelt er (~0,5 s), dann steht er wieder — aber nur,
   wenn er gerade sichtbar ist. Weckt ihn ein Tipp auf einem Aufgaben-Screen
   (dort ist er unsichtbar), springt er direkt auf "steht". */
function gefWach(){
  GEF.wachAb = Date.now();
  if(!GEF.schlaeft) return;
  GEF.schlaeft = false;
  // Frisch geweckt bleibt er erst mal da: Ohne Neuplanung wäre der nächste
  // Streifzug nach ein paar Minuten Schlaf längst überfällig, und er liefe
  // dem Kind beim nächsten Tick direkt vor der Nase davon.
  planeGefZeiten(GEF.wachAb);
  if(begleiterSchirm()){
    GEF.pose = "blinzelt";
    clearTimeout(GEF.wachBlinzelTimer);
    GEF.wachBlinzelTimer = setTimeout(() => {
      if(GEF.pose === "blinzelt"){ GEF.pose = "steht"; renderGef(); }
    }, GEF_ZEIT.wachBlinzeln);
  } else {
    GEF.pose = "steht";
  }
  renderGef();
}
// Ein Tipp auf den Fuchs selbst weckt über gefTippen() (das ruft gefWach()):
// Würde schon das pointerdown hier neu rendern, ersetzte es das Element unter
// dem Finger, BEVOR dessen click feuert — der Tipp verpuffte und die
// Sprechblase bliebe aus. Deshalb weckt dieser globale Griff nur Tipps
// außerhalb des Gefährten.
document.addEventListener("pointerdown", e => {
  if(begleiterAktiv() && !(e.target && e.target.closest && e.target.closest("#gefroot")))
    gefWach();
});

/* Räumt Timer/Intervall des Eigenlebens auf und beendet einen Spaziergang
   sofort, sobald der Begleiter unsichtbar wird (Aufgaben-Screen, Begleiter
   aus) — sonst liefe er unsichtbar minutenlang weiter oder stünde beim
   nächsten Anzeigen mitten in der Luft (Leitplanke: "Zustand sauber
   zurücksetzen"). Der Schlaf selbst ist unkritisch (der Fuchs bewegt sich
   dabei nicht vom Fleck) und bleibt darum unangetastet. */
function gefEigenlebenAbbrechen(){
  clearInterval(GEF.laufTimer);
  clearTimeout(GEF.laufEndeTimer);
  clearTimeout(GEF.gaehnTimer);
  clearTimeout(GEF.wachBlinzelTimer);
  if(GEF.laufPhase || GEF.draussen){
    GEF.laufPhase = null; GEF.laufRichtung = 0; GEF.draussen = false;
    planeGefZeiten(Date.now());
  }
  if(!GEF.schlaeft && GEF.pose !== "steht") GEF.pose = "steht";
}

/* ---------------------------------------------------------------- Rendering */
function renderGef(){
  const el = document.getElementById("gefroot");
  if(!el) return;
  if(!begleiterAktiv()){ gefEigenlebenAbbrechen(); el.innerHTML = ""; return; }
  if(gefNameOffen()){ el.innerHTML = gefNameHtml(); return; }
  if(gefTaufeOffen()){ el.innerHTML = gefTaufeHtml(); return; }
  if(!begleiterSchirm()){ gefEigenlebenAbbrechen(); el.innerHTML = ""; return; }
  if(GEF.nachfrage){ el.innerHTML = gefNachfrageHtml(); return; }
  el.innerHTML = gefPraesenzHtml();
}

/* a) Sichtbarer Spaziergang: Solange laufPhase oder draussen gesetzt sind,
   steht der Fuchs per Inline-Transform am Bildschirmrand — nur beim Losgehen
   ("raus") und beim Zurückkommen ("zurueck") bekommt er dafür eine lineare
   Gleit-Transition mit ausgewürfelter Dauer (GEF.laufDauer, 6–9 s). Läuft er
   nach links, wird er gespiegelt, weil die Posen selbst nach rechts schauen. */
function gefLaufStil(){
  if(!GEF.laufPhase && !GEF.draussen) return "";
  const amRand = GEF.laufRichtung < 0
    ? "translateX(-160%)"
    : `translateX(${Math.ceil(window.innerWidth) + 40}px)`;
  if(GEF.laufPhase === "raus"){
    const spiegel = GEF.laufRichtung < 0 ? " scaleX(-1)" : "";
    return `transition:transform ${GEF.laufDauer}ms linear;transform:${amRand}${spiegel}`;
  }
  if(GEF.laufPhase === "zurueck"){
    // Der Rückweg läuft in die Gegenrichtung des Hinwegs.
    const spiegel = GEF.laufRichtung > 0 ? " scaleX(-1)" : "";
    return `transition:transform ${GEF.laufDauer}ms linear;transform:translateX(0)${spiegel}`;
  }
  // "draussen": eingefroren am Rand, wartet unsichtbar — keine eigene Transition.
  const spiegel = GEF.laufRichtung < 0 ? " scaleX(-1)" : "";
  return `transition:none;transform:${amRand}${spiegel}`;
}

function gefPraesenzHtml(){
  const pose = (GEF.reaktion && Date.now() < GEF.reaktionBis) ? GEF.reaktion : (GEF.pose || "steht");
  const zzz = GEF.schlaeft ? `<span class="gef-zzz">💤</span>` : "";
  const klasse = "gef" + (GEF.schlaeft ? " schlaeft" : "");
  const stil = gefLaufStil();
  return `<div class="${klasse}"${stil ? ` style="${stil}"` : ""} onclick="gefTippen()">
      ${zzz}<img src="${avatarImg(pose)}" alt="${esc(gefName())}">
    </div>` + (GEF.blase ? gefBlaseHtml() : "");
}

/* -------------------------------------------------------------- Sprechblase
   5: Gruß mit Namen und EIN kontextabhängiger Satz, dazu der bestehende
   Vorlesen-Knopf. Schließt nach ~6 s oder bei einem weiteren Tipp. */
function gefSpruch(){
  const p = S.profile;
  if(p.streak >= 2) return `Du übst schon ${p.streak} Tage am Stück – stark!`;
  if(p.todayCount > 0 && p.todayCount < p.goal)
    return `Noch ${p.goal - p.todayCount} bis zu deinem Tagesziel – du schaffst das!`;
  if(p.todayCount >= p.goal) return "Dein Tagesziel steht schon. Alles andere ist Zugabe!";
  return p.name ? `Schön, dass du da bist, ${p.name}!` : "Schön, dass du da bist!";
}
function gefBlaseHtml(){
  const text = GEF.blaseText || `Hallo, ich bin ${gefName()}! ${gefSpruch()}`;
  return `<div class="gef-blase" onclick="gefTippen()">${esc(text)} ${readBtn(text)}</div>`;
}
function gefTippen(){
  gefWach();
  if(GEF.blase){ GEF.blase = false; GEF.blaseText = null; renderGef(); return; }
  GEF.blase = true; GEF.blaseText = null; renderGef();
  clearTimeout(GEF.blaseTimer);
  GEF.blaseTimer = setTimeout(() => { GEF.blase = false; renderGef(); }, 6000);
}

/* --------------------------------------------------------------- Spielername
   Elternwunsch 02.09.2026: bevor sich der Fuchs vorstellt, fragt die App kurz,
   wie das Kind selbst heißt. "Später" verschiebt die Frage nur bis zum
   nächsten echten Start (GEF.nameSpaeter lebt nicht in S). Anders als der
   Avatar-Name landet dieser Name — gesäubert, höchstens 18 Zeichen — beim
   Übertragen als Sync-Metadatum beim Rechner zu Hause (siehe syncNow()). */
function gefNameHtml(){
  const text = "Bevor es losgeht: Wie heißt du?";
  return `<div class="gef-overlay">
      <div class="gef-modal card">
        <img class="gef-modal-img" src="${avatarImg('winkt')}" alt="">
        <div class="gef-modal-text">${esc(text)} ${readBtn(text)}</div>
        <input id="spielerNameFeld" class="gef-input" maxlength="18" placeholder="Dein Name …"
          autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false"
          onkeydown="if(event.key==='Enter')gefNameEingabe()">
        <div class="row" style="margin-top:12px">
          <button class="btn primary grow" onclick="gefNameEingabe()">Weiter</button>
          <button class="btn" onclick="gefNameSpaeter()">Später</button>
        </div>
      </div>
    </div>`;
}
function gefNameEingabe(){
  const el = document.getElementById("spielerNameFeld");
  const name = ((el && el.value) || "").trim().slice(0, 18);
  if(name) gefNameSetzen(name);
}
function gefNameSetzen(name){
  S.profile.name = String(name).trim().slice(0, 18);
  save(); renderGef();
}
function gefNameSpaeter(){ GEF.nameSpaeter = true; renderGef(); }

/* ------------------------------------------------------------------- Taufe
   6: beim ersten V2-Start stellt er sich ehrlich vor und fragt nach einem
   Namen. "Später" verschiebt den Dialog nur bis zum nächsten echten Start
   (GEF.taufeSpaeter lebt nicht in S, überlebt also kein Neuladen). Der Name
   ist ein Freitext des Kindes und bleibt strikt lokal (Z1) — er erreicht
   logEvent()/syncNow() nie, anders als der Spielername oben. */
const GEF_VORSCHLAEGE = ["Kiko", "Blitz", "Rufus"];

function gefTaufeHtml(){
  const text = "Hallo! Ich bin dein Würfelfuchs — ein schlauer Computer-Begleiter. "
             + "Ich schaue dir beim Knobeln zu und freue mich mit dir. Wie soll ich heißen?";
  return `<div class="gef-overlay">
      <div class="gef-modal card">
        <img class="gef-modal-img" src="${avatarImg('winkt')}" alt="">
        <div class="gef-modal-text">${esc(text)} ${readBtn(text)}</div>
        <input id="gefNameFeld" class="gef-input" maxlength="18" placeholder="Name eingeben …"
          autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false"
          onkeydown="if(event.key==='Enter')gefTaufeEingabe()">
        <div class="row wrap" style="margin-top:10px">
          ${GEF_VORSCHLAEGE.map(n =>
            `<button class="btn gef-vorschlag" onclick='gefTaufe(${JSON.stringify(n)})'>${esc(n)}</button>`
          ).join("")}
        </div>
        <div class="row" style="margin-top:12px">
          <button class="btn primary grow" onclick="gefTaufeEingabe()">Fertig</button>
          <button class="btn" onclick="gefTaufeSpaeter()">Später</button>
        </div>
      </div>
    </div>`;
}
function gefTaufeEingabe(){
  const el = document.getElementById("gefNameFeld");
  const name = ((el && el.value) || "").trim().slice(0, 18);
  if(name) gefTaufe(name);
}
function gefTaufe(name){
  S.avatar.name = String(name).trim().slice(0, 18);
  S.avatar.getauft = true;
  save(); sfx("done"); renderGef();
}
function gefTaufeSpaeter(){ GEF.taufeSpaeter = true; renderGef(); }

/* -------------------------------------------------------- Abbruch-Nachfrage
   8 (D6): nach einem Sofort-Abbruch oder einem zur Hälfte verlassenen Paket
   fragt er sparsam nach dem Grund — höchstens einmal am Tag, nie zwei
   Sitzungen in Folge (eine Sitzung ohne Nachfrage setzt die Folge zurück),
   und immer wegtippbar. Aufgerufen aus finishSession()/quitSession(). */
function nachAbbruchFragen(unitId, anlass){
  const darf = !!anlass && begleiterAktiv()
    && S.avatar.letzteNachfrageTag !== String(today())
    && !S.avatar.nachfrageWarZuletzt;
  S.avatar.nachfrageWarZuletzt = darf;
  if(darf) S.avatar.letzteNachfrageTag = String(today());
  save();
  if(darf){ GEF.nachfrage = {unitId:unitId || ""}; }
  renderGef();
}

const GEF_GRUENDE = ["Zu lange gedauert", "Zu langweilig", "Zu schwer", "Ich wollte was anderes machen"];

function gefNachfrageHtml(){
  const text = "Magst du mir kurz sagen, warum du aufgehört hast?";
  return `<div class="gef-overlay">
      <div class="gef-modal card">
        <img class="gef-modal-img" src="${avatarImg('fragt')}" alt="">
        <div class="gef-modal-text">${esc(text)} ${readBtn(text)}</div>
        <div class="gef-gruende">
          ${GEF_GRUENDE.map((g, i) =>
            `<button class="btn gef-grund" onclick="gefGrundGeben(${i+1})">${esc(g)}</button>`
          ).join("")}
        </div>
        <button class="btn wide" style="margin-top:10px" onclick="gefNachfrageSchliessen()">
          Sag ich nicht</button>
      </div>
    </div>`;
}
function gefGrundGeben(grund){
  // Kein Freitext: nur die Paket-Kennung und eine Zahl 1–4 (Z1).
  logEvent("g", {u:(GEF.nachfrage && GEF.nachfrage.unitId) || "", w:grund});
  save();
  GEF.nachfrage = null;
  GEF.reaktion = "freut"; GEF.reaktionBis = Date.now() + 3000;
  GEF.blase = true; GEF.blaseText = "Danke! Das merke ich mir.";
  renderGef();
  clearTimeout(GEF.blaseTimer);
  GEF.blaseTimer = setTimeout(() => { GEF.blase = false; GEF.blaseText = null; renderGef(); }, 3000);
}
function gefNachfrageSchliessen(){ GEF.nachfrage = null; renderGef(); }

/* ------------------------------------------------------------ Spaziergang (a)
   Statt bisher unsichtbar zu verschwinden, läuft der Fuchs sichtbar los: Die
   Gehpose wechselt im Takt (GEF_ZEIT.laufTakt) zwischen laeuft1/laeuft2, dazu
   gleitet er per CSS-Transition zum nächstgelegenen Bildschirmrand (siehe
   gefLaufStil()). Erst danach folgt wie bisher die unsichtbare Wartezeit
   draußen, dann läuft er vom selben Rand sichtbar zurück, schnuppert kurz und
   steht wieder. */
function gefStreifzugRichtung(){
  const el = document.querySelector(".gef");
  if(!el) return -1;
  const r = el.getBoundingClientRect();
  return (window.innerWidth - r.right) < r.left ? 1 : -1;
}
function gefLaufTaktStarten(){
  clearInterval(GEF.laufTimer);
  GEF.laufTimer = setInterval(() => {
    GEF.pose = GEF.pose === "laeuft1" ? "laeuft2" : "laeuft1";
    renderGef();
  }, GEF_ZEIT.laufTakt);
}
function gefStreifzugRaus(jetzt){
  GEF.laufRichtung = gefStreifzugRichtung();
  GEF.laufPhase = "raus";
  GEF.laufDauer = GEF_ZEIT.laufDauerMin + Math.random()*GEF_ZEIT.laufDauerSpanne;
  GEF.pose = "laeuft1";
  gefLaufTaktStarten();
  renderGef();
  clearTimeout(GEF.laufEndeTimer);
  GEF.laufEndeTimer = setTimeout(() => {
    clearInterval(GEF.laufTimer);
    if(GEF.laufPhase === "raus"){
      GEF.laufPhase = null;
      GEF.draussen = true;
      GEF.zurueckUm = Date.now() + GEF_ZEIT.draussenMin + Math.random()*GEF_ZEIT.draussenSpanne;
      renderGef();
    }
  }, GEF.laufDauer);
}
function gefStreifzugZurueck(){
  GEF.draussen = false;
  GEF.laufPhase = "zurueck";
  GEF.laufDauer = GEF_ZEIT.laufDauerMin + Math.random()*GEF_ZEIT.laufDauerSpanne;
  GEF.pose = "laeuft1";
  gefLaufTaktStarten();
  renderGef();
  clearTimeout(GEF.laufEndeTimer);
  GEF.laufEndeTimer = setTimeout(() => {
    clearInterval(GEF.laufTimer);
    if(GEF.laufPhase === "zurueck"){
      GEF.laufPhase = null;
      planeGefZeiten(Date.now());
      // Wer gerade spazieren war, ist wach — sonst begänne direkt nach dem
      // Schnuppern das Gähnen, weil die Ruhe-Uhr seit Minuten läuft.
      GEF.wachAb = Date.now();
      GEF.pose = "schnuppert";
      renderGef();
      // Nur zurücksetzen, wenn zwischendurch nichts anderes (z. B. Gähnen)
      // die Pose schon selbst weitergeschaltet hat.
      setTimeout(() => {
        if(GEF.pose === "schnuppert"){ GEF.pose = "steht"; renderGef(); }
      }, GEF_ZEIT.schnuppertZurueck);
    }
  }, GEF.laufDauer);
}

/* --------------------------------------------------------- Einschlafen (b)
   Erst gähnt er kurz, dann erst schläft er wirklich ein — bricht die
   Zwischenzeit jemand durch eine neue Aktivität ab, bleibt er wach. */
function gefEinschlafen(){
  GEF.pose = "gaehnt";
  renderGef();
  clearTimeout(GEF.gaehnTimer);
  const wachAbBeimGaehnen = GEF.wachAb;
  GEF.gaehnTimer = setTimeout(() => {
    if(GEF.pose !== "gaehnt") return;
    if(!GEF.schlaeft && GEF.wachAb === wachAbBeimGaehnen){
      GEF.schlaeft = true; GEF.pose = "schlaeft";
    } else {
      GEF.pose = "steht";   // zwischendurch geweckt worden
    }
    renderGef();
  }, GEF_ZEIT.gaehntDauer);
}

/* ------------------------------------------------------------- Leerlauf (4)
   Blinzeln alle 4–8 s, alle 30–60 s kurz schnuppern/grübeln, nach 60 s ohne
   Interaktion gähnen und einschlafen (b), alle 2–5 Minuten ein sichtbarer
   Spaziergang nach draußen und zurück (a). Läuft nur bei sichtbarem
   Begleiter; bei prefers-reduced-motion entfällt nur der Spaziergang
   (Bewegung), nicht der Posenwechsel. */
function gefTick(){
  if(!begleiterAktiv() || !begleiterSchirm()) return;
  if(GEF.nachfrage || gefTaufeOffen()) return;     // ein offener Dialog pausiert das Eigenleben

  const jetzt = Date.now();
  if(GEF.reaktion && jetzt > GEF.reaktionBis) GEF.reaktion = null;
  if(GEF.reaktion) return;                          // die Erfolgspose hat Vorrang

  // Während einer Gleit-Transition (raus/zurück) übernehmen deren eigene
  // Timer (laufTimer/laufEndeTimer) das Weitere — hier ist nichts zu tun.
  if(GEF.laufPhase) return;

  if(GEF.draussen){
    if(jetzt >= GEF.zurueckUm) gefStreifzugZurueck();
    return;
  }

  if(jetzt - GEF.wachAb > GEF_ZEIT.ruheBisSchlaf){
    if(!GEF.schlaeft && GEF.pose !== "gaehnt") gefEinschlafen();
    return;
  }
  if(GEF.schlaeft) return;

  if(!REDUCED_MOTION && jetzt >= GEF.naechsterStreifzug){
    gefStreifzugRaus(jetzt);
    return;
  }
  if(jetzt >= GEF.naechsteGeste){
    const geste = Math.random() < .5 ? "schnuppert" : "gruebelt";
    GEF.pose = geste;
    GEF.naechsteGeste = jetzt + GEF_ZEIT.gesteMin + Math.random()*GEF_ZEIT.gesteSpanne;
    renderGef();
    // Self-Check statt Ausschlussliste: löst sich nur auf, solange die Pose
    // seither wirklich noch dieselbe ist (nicht z. B. schon "gaehnt").
    setTimeout(() => { if(GEF.pose === geste){ GEF.pose = "steht"; renderGef(); } }, 2000);
    return;
  }
  if(jetzt >= GEF.naechsterBlink){
    GEF.naechsterBlink = jetzt + GEF_ZEIT.blinkMin + Math.random()*GEF_ZEIT.blinkSpanne;
    GEF.pose = "blinzelt"; renderGef();
    setTimeout(() => { if(GEF.pose === "blinzelt"){ GEF.pose = "steht"; renderGef(); } }, 150);
  }
}
setInterval(gefTick, 1000);
</script>

<script>
/* ============================================================ Bildschirmpasse
   Übernommen aus VokabelQuest: Passt der Inhalt nicht, wird er verkleinert
   statt scrollbar gemacht. Ein Kind, das erst scrollen muss, um den
   Weiter-Knopf zu finden, verliert den Faden. */
function fitScreen(){
  const wrap = document.getElementById("fitwrap");
  if(!wrap) return;
  const inner = wrap.firstElementChild;
  inner.style.transform = ""; wrap.style.height = "";
  const need = inner.scrollHeight;
  const pad = 14;
  const avail = innerHeight - wrap.getBoundingClientRect().top - pad - 6;
  if(need <= 0 || avail <= 0 || need <= avail){ ensureContinueVisible(); return; }
  const s = Math.max(.55, avail / need);
  inner.style.transform = "scale(" + s.toFixed(4) + ")";
  wrap.style.height = Math.ceil(need * s) + "px";
  ensureContinueVisible();
}
function ensureContinueVisible(){
  const b = document.getElementById("cont");
  if(b && b.getBoundingClientRect().bottom > innerHeight - 4){
    b.scrollIntoView({block:"end", behavior:"smooth"});
  }
}
addEventListener("resize", () => { if(view.name === "session") fitScreen(); });

function mountSession(){
  if(!SESS) return;
  requestAnimationFrame(fitScreen);
  // Sachaufgaben, Geschichten und Logikrätsel einmal vorlesen, sobald sie
  // erscheinen — bei Logikgittern deckt das Rahmengeschichte, alle Hinweise
  // und die Frage ab (logikVorlesetext()), nicht nur ein einzelnes t.q.
  const t = curTask();
  if(!SESS.answered && SESS.spokenFor !== SESS.i && S.settings.speech
     && (t.type === "mehrschritt" || t.type === "logikgitter" || t.type === "roboter"
         || t.type === "positionen" || String(t.q||"").length > 70)){
    SESS.spokenFor = SESS.i;
    setTimeout(() => speak(
      t.type === "logikgitter" ? logikVorlesetext(t) :
      t.type === "roboter" ? roboterVorlesetext(t) :
      t.type === "positionen" ? positionenVorlesetext(t) : t.q), 260);
  }
}

document.addEventListener("keydown", e => {
  if(view.name !== "session" || !SESS){
    if(e.key === "Escape" && view.name !== "home") go("home");
    return;
  }
  const t = curTask();
  if(e.key === "Enter"){
    e.preventDefault();
    if(SESS.answered) return nextTask();
    if(t.type === "entdecken"){ grade(true); return nextTask(); }
    if(t.type === "zahl") return checkZahl();
    if(t.type === "mehrschritt") return checkStep();
    return;
  }
  if(e.key === "Escape") return quitSession();
  if(SESS.answered) return;
  if(/^[0-9]$/.test(e.key) && (t.type === "zahl" || t.type === "mehrschritt")) return padKey(e.key);
  if(e.key === "Backspace" && (t.type === "zahl" || t.type === "mehrschritt")) return padKey("del");
  if(/^[1-4]$/.test(e.key)){
    const b = document.querySelectorAll(".opt:not([disabled])")[+e.key - 1];
    if(b) b.click();
  }
});

/* ============================================================ Android-Anbindung */
function setupNative(){
  if(!NATIVE) return;
  document.body.classList.add("native");
  const P = CAP.Plugins || {};
  if(P.StatusBar){
    try{ P.StatusBar.setStyle({style:"DARK"}); P.StatusBar.setBackgroundColor({color:"#0b1020"}); }catch(e){}
  }
  if(P.SplashScreen) try{ P.SplashScreen.hide(); }catch(e){}
  if(P.App) try{
    P.App.addListener("backButton", () => {
      if(view.name === "session") return quitSession();
      if(view.name !== "home") return go("home");
      P.App.exitApp();
    });
    P.App.addListener("appStateChange", s => {
      if(!s.isActive){
        stopSpeaking();
        // Geht die App in den Hintergrund, kann es das letzte Mal für eine
        // Weile gewesen sein. Was anliegt, jetzt noch loswerden.
        syncNow(true).catch(() => {});
      }else{
        // Zurück im Vordergrund zählt als Öffnen: nachsehen, ob es etwas
        // Neues gibt, und Liegengebliebenes übertragen.
        checkUpdateLeise();
        syncTakt();
      }
    });
  }catch(e){}
}

rollDay();
setupNative();
render();
// Die eigene Fassung kennt nur Android genau. Erst danach nach Updates sehen —
// vorher wüsste die Suche nicht, womit sie vergleichen soll.
readVersion().then(() => {
  if(view.name === "settings") render();
  checkUpdateLeise();
});
// Liegengebliebene Ereignisse loswerden und Elternwünsche holen, sobald der
// Rechner zu Hause erreichbar ist. Scheitert es, passiert schlicht nichts.
syncLeise();
</script>
