}

const serverUrl = pfad => {
  let h = (S.server || "").trim();
  if(!h) return "";
  try{
    const u = new URL(/^https?:\/\//.test(h) ? h : "https://" + h);
    if(u.username || u.password || u.search || u.hash || !["", "/"].includes(u.pathname)) return "";
    u.protocol = "https:";
    if(u.port === "8790") u.port = "8792"; // public legacy download address -> private TLS service
    return u.origin + pfad;
  }catch(e){ return ""; }
};

/* ===== Secure device connection: no parent password or provider API key on a child device. */
const PAIR_STORAGE = "mathcraft_device_access_v1";
let AUTH = {dev:"", key:"", server:"", expires:0, loaded:false, note:""};
let authLoad = null;
async function loadDeviceAccess(){
  if(AUTH.loaded) return AUTH;
  if(authLoad) return authLoad;
  authLoad = (async () => {
    try{
      let raw;
      if(NATIVE){
        const plugin = (CAP.Plugins || {}).MathCraftCredentials;
        if(!plugin) throw new Error("Sicherer Gerätespeicher fehlt");
        raw = (await plugin.get()).value;
      }else raw = localStorage.getItem(PAIR_STORAGE);
      const parsed = raw ? JSON.parse(raw) : {};
      if(parsed.dev === S.dev && typeof parsed.key === "string" && /^[0-9a-f]{64}$/.test(parsed.key)
          && typeof parsed.server === "string" && parsed.server.startsWith("https://")){
        AUTH = {...AUTH, ...parsed};
      }
    }catch(e){ AUTH.note = "Gerät noch nicht verbunden."; }
    AUTH.loaded = true;
    return AUTH;
  })();
  return authLoad;
}
async function storeDeviceAccess(){
  const value = JSON.stringify({dev:AUTH.dev,key:AUTH.key,server:AUTH.server,expires:AUTH.expires});
  if(NATIVE){
    const plugin = (CAP.Plugins || {}).MathCraftCredentials;
    if(!plugin) throw new Error("Sicherer Gerätespeicher fehlt");
    await plugin.set({value});
  }else localStorage.setItem(PAIR_STORAGE,value);
}
const bytesHex = bytes => Array.from(new Uint8Array(bytes), b => b.toString(16).padStart(2,"0")).join("");
async function privateRequest(pfad, payload, options={}){
  await loadDeviceAccess();
  const url = serverUrl(pfad), origin = url ? new URL(url).origin : "";
  if(!origin.startsWith("https://") || AUTH.dev !== S.dev || AUTH.server !== origin || !AUTH.key
      || AUTH.expires <= Date.now()/1000 || !crypto.subtle){
    throw new Error("Gerät zuerst über die Elternseite verbinden");
  }
  const body = JSON.stringify(payload);
  const stamp = String(Math.floor(Date.now()/1000));
  const nonce = bytesHex(crypto.getRandomValues(new Uint8Array(16)));
  const encoder = new TextEncoder();
  const digest = bytesHex(await crypto.subtle.digest("SHA-256",encoder.encode(body)));
  const canonical = ["POST",pfad,stamp,nonce,digest].join("\n");
  const key = await crypto.subtle.importKey("raw",encoder.encode(AUTH.key),{name:"HMAC",hash:"SHA-256"},false,["sign"]);
  const signature = bytesHex(await crypto.subtle.sign("HMAC",key,encoder.encode(canonical)));
  return fetch(url,{...options,method:"POST",cache:"no-store",credentials:"omit",
    headers:{"Content-Type":"application/json","X-MC-Device":S.dev,"X-MC-Time":stamp,
             "X-MC-Nonce":nonce,"X-MC-Signature":signature},body});
}
async function pairDevice(){
  AUTH.note = "";
  const input = document.getElementById("paircode");
  const code = (input && input.value || "").trim();
  if(input) input.value = "";
  const url = serverUrl("/pair");
  if(!url || !code){ AUTH.note = "Adresse und Verbindungs-Code eingeben."; return render(); }
  const ctl = new AbortController();
  const stop = setTimeout(() => ctl.abort(),10000);
  try{
    if(NATIVE && !(CAP.Plugins || {}).MathCraftCredentials) throw new Error("Neues App-Update erforderlich");
    const response = await fetch(url,{method:"POST",credentials:"omit",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({dev:S.dev,code}),signal:ctl.signal});
    if(!response.ok) throw new Error("Verbindung abgelehnt");
    const result = await response.json();
    if(result.dev !== S.dev || !/^[0-9a-f]{64}$/.test(result.key || "")) throw new Error("Ungültige Freigabe");
    AUTH = {...AUTH,dev:S.dev,key:result.key,expires:Number(result.expires),server:new URL(url).origin,loaded:true};
    await storeDeviceAccess();
    AUTH.note = "Gerät sicher verbunden.";
  }catch(e){ AUTH.note = "Verbindung fehlgeschlagen. Adresse, App-Update und Eltern-Code prüfen."; }
  finally{ clearTimeout(stop); }
  render();
}
/* ===== End secure device connection. */

async function checkUpdate(){
  if(UPD.laeuft) return;
  if(!S.server){ UPD.stand = "Trage zuerst die Adresse des Rechners ein."; return render(); }
  UPD.laeuft = true; UPD.stand = "Ich schaue nach …"; UPD.info = null; render();
  try{
    const ctl = new AbortController();
    const stop = setTimeout(() => ctl.abort(), 6000);   // im falschen WLAN nicht ewig warten
    const r = await fetch(serverUrl("/version"), {cache:"no-store", signal:ctl.signal});
    clearTimeout(stop);
    if(!r.ok) throw new Error("Antwort " + r.status);
    const info = await r.json();
    UPD.info = info;
    UPD.stand = (info.versionCode > MEINE.code)
      ? "" : "Du hast schon die neueste Fassung.";
  }catch(e){
    UPD.info = null;
    UPD.stand = /abort/i.test(String(e))
      ? "Der Rechner antwortet nicht. Bist du im WLAN zu Hause?"
      : "Kein Kontakt zum Rechner. Läuft der Dienst, und stimmt die Adresse?";
  }
  UPD.laeuft = false; render();
}

/* Beim Öffnen von selbst nachsehen. Leise: kein "Ich schaue nach …", keine
   Fehlermeldung, wenn der Rechner aus ist — auf dem Startbildschirm hat beides
   nichts zu suchen. Gibt es etwas Neues, erscheint dort ein Knopf; sonst merkt
   niemand etwas davon.

   Beim Zurückholen aus dem Hintergrund nicht öfter als alle paar Minuten. Ein
   Kind, das zwischen Aufgaben kurz woanders hinschaut, soll nicht bei jeder
   Rückkehr eine Netzanfrage auslösen. */
const UPD_ABSTAND = 300000;
let updZuletzt = 0;

async function checkUpdateLeise(){
  if(UPD.laeuft || !S.server) return;
  if(Date.now() - updZuletzt < UPD_ABSTAND) return;
  updZuletzt = Date.now();
  UPD.laeuft = true;
  try{
    const ctl = new AbortController();
    const stop = setTimeout(() => ctl.abort(), 6000);
    const r = await fetch(serverUrl("/version"), {cache:"no-store", signal:ctl.signal});
    clearTimeout(stop);
    if(r.ok){
      const info = await r.json();
      if(info && info.versionCode > MEINE.code){ UPD.info = info; UPD.stand = ""; }
    }
  }catch(e){}                       // still: es gibt eben gerade nichts zu holen
  UPD.laeuft = false;
  if(UPD.info) render();
}

const updBereit = () => !!(UPD.info && UPD.info.versionCode > MEINE.code);

/* Herunterladen übernimmt Android: der Browser lädt die Datei, danach fragt
   das System selbst, ob installiert werden soll. Der Lernstand bleibt dabei
   erhalten – gleicher Paketname, gleicher Schlüssel. */
async function downloadUpdate(){
  const url = serverUrl("/app.apk");
  if(!url) return;
  const P = (window.Capacitor && Capacitor.Plugins) || {};
  UPD.stand = "Der Download läuft. Tippe danach auf die Meldung von Android, "
            + "um zu aktualisieren — dein Fortschritt bleibt erhalten.";
  render();
  try{
    if(P.Browser && P.Browser.open) await P.Browser.open({url});
    else window.open(url, "_blank");
  }catch(e){
    window.open(url, "_blank");
  }
}

/* ================================================================ Ereignisse
   Damit der Tutor beobachten kann und die Elternseite etwas zu zeigen hat,
   hält die App fest, was passiert ist. Der Puffer bleibt auf dem Gerät, bis
   der Rechner zu Hause erreichbar ist — ohne WLAN geht nichts verloren, es
   wird nur später übertragen.

   Kurze Schlüssel, weil der Puffer über Wochen wächst:
     i Nummer · t Zeit · s Sitzung · e Art
     "a" Antwort      u Paket · k Fertigkeit · g Stufe · y Typ · o richtig
                      ms Dauer · r Wiederholung · h Tipp gezeigt
     "n" entdeckt     u · k · g
     "s" Sitzungsende q Anlass · u Paket · n gefragt · c richtig · ms Dauer · z Abbruch
     "d" Entscheidung siehe protokolliere()
     "g" Abbruchgrund u Paket · w Grund (1–4, kein Freitext) — siehe nachAbbruchFragen()
     "f" Spaß-Signal  u Paket · w Bewertung (1 nicht gut, 2 ging so, 3 super,
                      kein Freitext) — siehe gibSpassFeedback() */
let SITZUNG_ID = "";

function neueSitzungsId(){
  const a = new Uint8Array(4);
  try{ crypto.getRandomValues(a); }
  catch(e){ for(let i=0;i<a.length;i++) a[i] = (Math.random()*256)|0; }
  return Array.from(a, b => b.toString(16).padStart(2,"0")).join("");
}

function logEvent(art, felder){
  const L = S.log;
  L.ev.push(Object.assign({i:L.next++, t:Date.now(), s:SITZUNG_ID, e:art}, felder));
  // Erst die Aufbewahrungsfrist, dann die harte Obergrenze. Was dabei wegfällt,
  // wird gezählt — die Elternseite soll eine Lücke benennen können, statt sie
  // stillschweigend zu übergehen.
  const grenze = Date.now() - LOG_TAGE*DAY;
  const vorher = L.ev.length;
  if(L.ev.length && L.ev[0].t < grenze) L.ev = L.ev.filter(x => x.t >= grenze);
  if(L.ev.length > LOG_MAX) L.ev = L.ev.slice(-LOG_MAX);
  L.lost += vorher - L.ev.length;
}

/* Eine Entscheidung des Tutors festhalten. Ohne Eintrag darf keine Anpassung
   passieren — die Elternseite muss jede erklären können. */
function protokolliere(art, grund, felder){
  logEvent("d", Object.assign({d:art, w:grund}, felder));
}

/* ---------------------------------------------------------------- Übertragung
   Der Austausch mit dem Heim-Dienst geht in beide Richtungen: Ereignisse
   hinauf, Elternwünsche herunter. */
const SYNC = {laeuft:false, stand:"", zuletzt:0, offen:0, naechster:0, fehler:0};
const SYNC_BATCH = 1500;

/* Wie oft übertragen wird. Nicht nach jeder Antwort — das wären bei einem
   Paket acht Anfragen, und der Puffer ist ja genau dafür da. Aber auch nicht
   erst am Ende der Sitzung: Bricht das Kind mittendrin ab oder geht der Akku
   aus, wäre alles bis dahin ungesehen. Ein fester Takt trifft beides.

   Klappt es nicht, wird der Abstand verdoppelt statt stur weiterzuklopfen —
   im falschen WLAN kostet jeder Versuch sechs Sekunden Funk und Akku. */
const SYNC_TAKT = 20000;        // so oft wird nachgesehen, ob etwas anliegt
const SYNC_MIN  = 15000;        // so kurz hintereinander nicht zweimal
const SYNC_MAX  = 300000;       // so weit wird bei Fehlschlägen gestreckt

async function syncNow(leise){
  if(SYNC.laeuft) return false;
  const url = serverUrl("/sync");
  if(!url){
    if(!leise){ SYNC.stand = "Trage zuerst die Adresse des Rechners ein."; render(); }
    return false;
  }
  SYNC.laeuft = true;
  if(!leise){ SYNC.stand = "Ich übertrage …"; render(); }
  let ok = false;
  try{
    // In Häppchen, damit eine lange Offline-Phase nicht an einer zu großen
    // Nutzlast scheitert. Bestätigtes fliegt sofort aus dem Puffer.
    for(let runde = 0; runde < 40; runde++){
      const paket = S.log.ev.slice(0, SYNC_BATCH);
      const ctl = new AbortController();
      const stop = setTimeout(() => ctl.abort(), 8000);
      const r = await privateRequest("/sync", {
        // D: welche Pakete gerade offen sind (stars<2) — nur die Ids, damit
        // der Dienst einem Planposten ansehen kann, ob es dazu überhaupt noch
        // etwas zu stellen gibt ("nicht stellbar").
        // Spielername (Elternwunsch 02.09.2026): ein Sync-Metadatum neben den
        // Ereignissen, kein Ereignisfeld — er landet nie in einem Eintrag von
        // S.log.ev. Der Avatar-Name des Fuchses (S.avatar.name) bleibt davon
        // getrennt und erreicht diese Ladung weiterhin nie.
        v:1, dev:S.dev, ev:paket, name:(S.profile.name||"").slice(0,18),
                             stats:{answers:S.stats.answers, lost:S.log.lost,
                                    offen:DATA.units.filter(u => ((S.units[u.id]||{}).stars||0) < 2)
                                                     .map(u => u.id)}}, {signal:ctl.signal});
      clearTimeout(stop);
      if(!r.ok) throw new Error("Antwort " + r.status);
      const a = await r.json();
      const ack = Number(a.ack) || 0;
      S.log.ev = S.log.ev.filter(e => e.i > ack);
      if(Array.isArray(a.wishes)) S.wishes = a.wishes;
      if(Array.isArray(a.plan)) S.plan = a.plan;
      save();
      ok = true;
      if(!paket.length || !S.log.ev.length) break;
    }
    SYNC.zuletzt = Date.now();
    SYNC.fehler = 0;
    SYNC.naechster = Date.now() + SYNC_MIN;
    SYNC.stand = S.log.ev.length ? "Teilweise übertragen, " + S.log.ev.length + " offen."
                                 : "Alles übertragen.";
  }catch(e){
    SYNC.fehler++;
    // 15 s, 30 s, 60 s … bis höchstens fünf Minuten
    SYNC.naechster = Date.now() + Math.min(SYNC_MAX, SYNC_MIN * Math.pow(2, SYNC.fehler - 1));
    SYNC.stand = /abort/i.test(String(e))
      ? "Der Rechner antwortet nicht. Bist du im WLAN zu Hause?"
      : "Kein Kontakt zum Rechner. Läuft der Dienst, und stimmt die Adresse?";
  }
  SYNC.laeuft = false;
  SYNC.offen = S.log.ev.length;
  if(!leise) render();
  return ok;
}

/* Im Hintergrund und ohne Rückmeldung. Scheitert es, bleibt der Puffer liegen
   und der nächste Takt holt es nach. */
function syncLeise(){ setTimeout(() => { syncNow(true).catch(() => {}); }, 400); }

/* Der Takt. Läuft, solange die App offen ist, und tut nichts, wenn nichts
   anliegt — dann kostet er auch nichts. */
function syncTakt(){
  if(SYNC.laeuft || !S.server || !S.log.ev.length) return;
  if(Date.now() < SYNC.naechster) return;
  syncNow(true).catch(() => {});
}
setInterval(syncTakt, SYNC_TAKT);

/* =============================================================== Erklärhilfe
   Klemmt es beim zweiten Anlauf immer noch, hilft der feste Tipp meist nicht
   weiter — er sagt, worauf zu achten ist, nicht, wie es geht. Dann rechnet der
   Rechner zu Hause eine gleichartige Aufgabe vor.

   Geschickt werden nur Paket und Aufgabennummer. Den Text schlägt der Dienst
   selbst nach, und der Schlüssel für das Sprachmodell liegt dort — auf dem
   Handy hat er nichts verloren.

   Scheitert es, passiert nichts Sichtbares: Der feste Tipp steht ja da. Ein
   Kind soll keine Fehlermeldung zu sehen bekommen. */
let ERK = {fuer:"", laeuft:false, text:"", beispiel:null};

const erkSchluessel = t => (t.src || "") + "#" + (t.idx === undefined ? -1 : t.idx);

/* Ob für diese Aufgabe überhaupt eine Erklärung zu holen ist. Dieselben drei
   Bedingungen, an denen holeErklaerung() sonst still abbricht — hier vorher
   gefragt, damit kein Knopf erscheint, der nichts tut.

   Die vier neuen Typen (Roboter, Bildwahl, Bildzahl, Positionen) haben keinen
   Rechenterm — der Erklär-Dienst hätte nichts zu erklären, also erscheint der
   Knopf für sie erst gar nicht. */
const OHNE_ERKLAERUNG = new Set(["roboter", "bildwahl", "bildzahl", "positionen"]);
const kannErklaeren = t => !!(t && !OHNE_ERKLAERUNG.has(t.type) &&
  serverUrl("/erklaer") && t.src && t.idx !== undefined);

/* Eine Zeile aus dem Strom verarbeiten. Getrennt, damit beide Wege — der
   strömende und der Rückfall — genau dasselbe tun. */
function erkZeile(zeile, key){
  if(!zeile.trim() || ERK.fuer !== key) return;
  let m;
  try{ m = JSON.parse(zeile); }catch(e){ return; }
  if(m.t === "bsp") ERK.beispiel = m.v;
  else if(m.t === "txt"){ ERK.text += m.v; render(); }
  else if(m.t === "weg"){ ERK.text = ""; ERK.beispiel = null; ERK.laeuft = false; }
}

async function holeErklaerung(t){
  const url = serverUrl("/erklaer");
  if(!url || !t.src || t.idx === undefined) return;
  const key = erkSchluessel(t);
  if(ERK.fuer === key && (ERK.laeuft || ERK.text)) return;   // schon dran oder schon da
  ERK = {fuer:key, laeuft:true, text:"", beispiel:null};
  render();
  try{
    const ctl = new AbortController();
    const stop = setTimeout(() => ctl.abort(), 12000);
    const r = await privateRequest("/erklaer", {u:t.src, i:t.idx}, {signal:ctl.signal});
    if(!r.ok) throw new Error("Antwort " + r.status);

    if(r.body && r.body.getReader){
      // Der Normalfall: Wort für Wort, sobald es kommt.
      const leser = r.body.getReader(), dek = new TextDecoder();
      let rest = "";
      for(;;){
        const {done, value} = await leser.read();
        if(done) break;
        rest += dek.decode(value, {stream:true});
        const zeilen = rest.split("\n");
        rest = zeilen.pop();                    // die letzte ist evtl. angeschnitten
        zeilen.forEach(z => erkZeile(z, key));
        if(ERK.fuer !== key) break;             // die Aufgabe ist weitergegangen
      }
      erkZeile(rest, key);
    }else{
      // Alter WebView ohne Strom-Leser: dann eben alles auf einmal. Langsamer,
      // aber es fehlt nichts.
      (await r.text()).split("\n").forEach(z => erkZeile(z, key));
    }
    clearTimeout(stop);
  }catch(e){}
  if(ERK.fuer === key){ ERK.laeuft = false; render(); }
}

/* =================================================================== Router */
let view = {name:"home", opts:{}};
const VIEWS = {};
function go(name, opts){
  view = {name, opts:opts || {}};
  stopSpeaking();
  scrollTo(0,0);
  render();
}
function render(){
  const el = document.getElementById("app");
  el.innerHTML = (VIEWS[view.name] || VIEWS.home)();
  document.body.classList.toggle("insession", view.name === "session");
  el.classList.remove("fade"); void el.offsetWidth; el.classList.add("fade");
  if(view.name === "session") mountSession();
  renderGef();   // D5: der Begleiter lebt außerhalb von #app, siehe unten
}
</script>

<script>
/* ============================================================== Schwierigkeit
   Ein Kind, das den Stoff schon kann, darf nicht durch alles durchgeführt
   werden — Unterforderung vertreibt schneller als Überforderung. Deshalb legt
   die App das Niveau selbst fest und springt, sobald etwas sofort sitzt.

   Zwei Größen steuern das:
     · Grundniveau  — was er insgesamt zeigt. Zwei fehlerfrei gelöste Pakete
                      einer Stufe genügen: dann fängt er auch in Welten, die er
                      noch nie gesehen hat, nicht mehr bei eins an.
     · Weltniveau   — was er in DIESER Welt zeigt. Geometrie kann sitzen,
                      während Sachaufgaben noch haken. */
const MAX_STAGE = MAX_STAGE_ROH;
const PERFEKT_FUER_AUFSTIEG = 2;

function baseStage(){
  const perfekt = {};
  Object.entries(S.units).forEach(([id, p]) => {
    const u = UNITS[id];
    if(u && p.stars >= 3) perfekt[u.stage] = (perfekt[u.stage] || 0) + 1;
  });
  /* Der Boden. Ein Viertklässler soll nicht bei „Zahlen bis 20“ anfangen und
     sich acht fehlerfreie Pakete lang hocharbeiten, bis es interessant wird.
     Ist keine Klasse eingestellt (einstieg 0), bleibt es bei 1 — genau das
     Verhalten aller Lernstände von vor dieser Einstellung.

     Ein Boden, keine Decke: nach oben zählt weiterhin nur, was das Kind
     zeigt. Zu hoch eingestellt korrigiert sich nichts von selbst — deshalb
     liegt der Einstieg je Klasse bewusst eine Stufe unter dem Lehrplan
     (build/curriculum.py, KLASSEN). */
  let base = Math.max(1, Math.min(MAX_STAGE, S.profile.einstieg || 0));
  for(let s = 1; s <= MAX_STAGE; s++){
    if((perfekt[s] || 0) >= PERFEKT_FUER_AUFSTIEG) base = Math.max(base, s + 1);
  }
  return Math.min(MAX_STAGE, base);
}

/* Klasse setzen. Ändert nur den Boden, nie den Lernstand: Sterne, Level und
   Wiederholungstermine bleiben unangetastet. Wer sich vertippt, stellt es
   zurück und ist wieder da, wo er war. */
function setzeKlasse(k){
  const e = KLASSEN.find(x => x.k === k);
  S.profile.klasse = e ? k : 0;
  S.profile.einstieg = e ? e.einstieg : 0;
  save(); render();
}

function areaStage(aid){
  let stufe = baseStage();
  unitsOfArea(aid).forEach(u => {
    const p = S.units[u.id];
    if(!p) return;
    if(p.stars >= 3) stufe = Math.max(stufe, u.stage + 1);   // saß auf Anhieb
    else if(p.stars >= 2) stufe = Math.max(stufe, u.stage);  // sitzt, Stufe bleibt
  });
  return Math.min(MAX_STAGE, stufe);
}

/* ====================================================== Langeweile und Frust
   Die Stufe allein trifft es nicht. Ein Kind kann auf seiner Stufe stehen und
   sich trotzdem langweilen, weil genau diese Fertigkeit längst sitzt — oder
   verzweifeln, weil genau diese eine Sache nicht will.

   Die Schwellen stehen so in ZIELE.md und noch einmal in tutor/auswertung.py.
   Wer sie hier ändert, muss sie dort mitändern; sonst misst die Elternseite
   etwas anderes, als die App tut. */
const LANGWEILIG_L = 4, LANGWEILIG_QUOTE = .90, LANGWEILIG_N = 10;
const ZU_SCHWER_QUOTE = .40, ZU_SCHWER_N = 6;
const RUECKKEHR_QUOTE = .70;      // so gut muss die Vorbedingung sitzen
const TYP_MAX = .35;              // kein Aufgabentyp über diesem Anteil

const fenster = (id, n) => (stRead(id).h || []).slice(-n);
const quoteVon = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0;

/* Sitzt so sicher, dass eine weitere Runde nichts mehr bringt. */
function istLangweilig(id){
  const x = stRead(id), f = fenster(id, LANGWEILIG_N);
  return x.l >= LANGWEILIG_L && f.length >= LANGWEILIG_N && quoteVon(f) >= LANGWEILIG_QUOTE;
}

/* Geht gerade schief. Sechs Antworten sind wenig, aber mehr abzuwarten hieße,
   ihn sehenden Auges weiter scheitern zu lassen. */
function istZuSchwer(id){
  const f = fenster(id, ZU_SCHWER_N);
  return f.length >= ZU_SCHWER_N && quoteVon(f) <= ZU_SCHWER_QUOTE;
}

/* Worauf eine Fertigkeit aufbaut: die höchste darunterliegende Stufe derselben
   Welt, für die es Pakete gibt. Der Lehrplan führt keine Abhängigkeiten, aber
   innerhalb einer Welt sind die Stufen genau das. */
function vorbedingung(id){
  const sk = skillOf(id);
  if(!sk) return null;
  return SKILLS.filter(s => s.area === sk.area && s.stage < sk.stage
                         && DATA.units.some(u => u.skill === s.id))
               .sort((a, b) => b.stage - a.stage)[0] || null;
}

/* Zurückgestelltes kommt erst wieder, wenn die Vorbedingung wirklich sitzt. */
function darfZurueck(id){
  const v = vorbedingung(id);
  if(!v) return true;                       // nichts darunter: kein Grund zu warten
  const f = fenster(v.id, ZU_SCHWER_N);
  return f.length >= ZU_SCHWER_N && quoteVon(f) >= RUECKKEHR_QUOTE;
}

/* Welche Aufgabenart zuletzt überhandgenommen hat. */
function typAnteile(){
  const t = S.typLog || [], je = {};
  t.forEach(y => je[y] = (je[y] || 0) + 1);
  const out = {};
  for(const k in je) out[k] = je[k] / t.length;
  return out;
}
function ueberzogenerTyp(){
  const a = typAnteile();
  if((S.typLog || []).length < 20) return null;     // zu wenig für eine Aussage
  let schlimmster = null;
  for(const k in a) if(a[k] > TYP_MAX && (!schlimmster || a[k] > a[schlimmster])) schlimmster = k;
  return schlimmster;
}
const typAnteilIn = (u, typ) => !u.tasks.length ? 0
  : u.tasks.filter(t => t.type === typ).length / u.tasks.length;

/* B: Verweigerung pausiert das Vorziehen. Ein Sofort-Abbruch ist ein Paketlauf
   mit 0 Antworten (das bestehende Sitzungsende-Ereignis mit n=0) — das Kind hat
   das Paket gesehen und sich sofort abgewandt. Drei davon in Folge nehmen das
   Paket für 24 Stunden aus dem Vorziehen heraus; die normale Niveau-Auswahl
   greift weiter, denn dort widerspricht niemand aktiv. Ein Antwortlauf setzt
   den Zähler zurück, ein weiterer Sofort-Abbruch nach Ablauf der 24 Stunden
   verlängert sie erneut. */
const SOFORT_SCHWELLE = 3;
const SOFORT_PAUSE_MS = 24 * 3600 * 1000;

function vermerkeAbbruch(unitId, geantwortet){
  // Rückgabe: true, wenn DIESER Lauf ein Sofort-Abbruch war (0 Antworten) —
  // D6 nutzt das als einen der beiden Anlässe für die Fuchs-Nachfrage.
  if(!unitId || !UNITS[unitId]) return false;
  const x = S.units[unitId] || (S.units[unitId] = {stars:0, plays:0, sofort:0, pausiertBis:0});
  if(geantwortet > 0){ x.sofort = 0; return false; }
  x.sofort = (x.sofort || 0) + 1;
  if(x.sofort >= SOFORT_SCHWELLE) x.pausiertBis = Date.now() + SOFORT_PAUSE_MS;
  return true;
}

const istPausiert = u => {
  const x = S.units[u.id];
  return !!(x && x.pausiertBis && x.pausiertBis > Date.now());
};

/* A: Ein "jetzt"-Wunsch ist einmalig. Lokal wird das sofort vermerkt, damit
   dasselbe Paket nicht gleich wieder vorgezogen wird, bevor der Dienst
   geantwortet hat; das Ereignis unten trägt es zusätzlich in die Wünsche-
   Ablage beim Dienst ein, damit die Elternseite und jedes andere Gerät es
   auch erfahren. */
const wunschErfuelltLokal = w =>
  (S.wishesDone || []).some(d => d.ziel === w.ziel && d.id === w.id && d.t === w.t);

function pruefeWunschErfuellung(u){
  if(!u) return;
  const sk = skillOf(u.skill) || {};
  (S.wishes || []).forEach(w => {
    if(!w || w.art !== "jetzt" || w.status === "erfuellt" || wunschErfuelltLokal(w)) return;
    if(Date.now() <= (w.t || 0)) return;              // erst NACH dem Wunsch zählt
    const trifft = (w.ziel === "skill" && w.id === u.skill) ||
                   (w.ziel === "bereich" && w.id === sk.area);
    if(!trifft) return;
    S.wishesDone.push({ziel:w.ziel, id:w.id, t:w.t});
    if(S.wishesDone.length > WISHES_DONE_MAX) S.wishesDone = S.wishesDone.slice(-WISHES_DONE_MAX);
    logEvent("w", {z:w.ziel, k:w.id, wz:w.t});
  });
}

/* Ein Wunsch der Eltern zu diesem Paket, falls einer vorliegt. Ein erfüllter
   "jetzt"-Wunsch zählt nicht mehr — weder nach der Bestätigung des Dienstes
   (w.status) noch, bevor die überhaupt ankam, nach der eigenen Aufzeichnung
   (wunschErfuelltLokal). */
function wunschFuer(u){
  const sk = skillOf(u.skill) || {};
  for(const w of (S.wishes || [])){
    if(!w || !w.art || w.status === "erfuellt" || wunschErfuelltLokal(w)) continue;
    if(w.ziel === "skill" && w.id === u.skill) return w.art;
    if(w.ziel === "bereich" && w.id === sk.area) return w.art;
  }
  return null;
}

/* Was der Tutor zu dieser Fertigkeit entschieden hat.

   Er entscheidet allein — keine Schwelle überstimmt ihn, und wenn er etwas
   weit über dem bisherigen Niveau will, bekommt er es. Nur ein ausdrücklicher
   Elternwunsch geht vor; das ist die Stelle, an der jemand widersprechen kann,
   nachdem er auf der Elternseite gelesen hat, was der Tutor vorhat. */
function planFuer(u){
  if(wunschFuer(u)) return null;            // die Eltern haben das letzte Wort
  for(const p of (S.plan || [])){
    if(p && p.skill === u.skill && ["vor","zurueck","ueber"].includes(p.art)) return p;
  }
  return null;
}
const planGrund = u => (planFuer(u) || {}).grund || "";

/* ------------------------------------------------------------ Die Auswahl */
function sortiere(pool, mehr){
  const letzteWelt = (skillOf((UNITS[S.profile.lastUnitId] || {}).skill) || {}).area;
  const ziel = u => areaStage((skillOf(u.skill) || {}).area) + (mehr ? 1 : 0);
  const zuviel = ueberzogenerTyp();
  return pool.slice().sort((a, b) => {
    const wa = (skillOf(a.skill) || {}).area, wb = (skillOf(b.skill) || {}).area;
    return (wa === letzteWelt) - (wb === letzteWelt)     // andere Welt zuerst
        || Math.abs(a.stage - ziel(a)) - Math.abs(b.stage - ziel(b))
        // gegen die Schieflage: wer weniger vom überzogenen Typ bringt, zuerst
        || (zuviel ? typAnteilIn(a, zuviel) - typAnteilIn(b, zuviel) : 0)
        || ((S.units[a.id] || {}).plays || 0) - ((S.units[b.id] || {}).plays || 0)
        || a.stage - b.stage;
  });
}

/* Die Reihenfolge für alles, was jemand ausdrücklich vorgezogen hat — der
   Tutor mit seinem Plan oder die Eltern mit einem Wunsch.

   Hier darf der Abstand zum Niveau nicht mehr mitreden, denn er ist genau das
   Kriterium, gegen das entschieden wurde. Der Tutor holt einen Einstieg auf
   Stufe 1 in eine leere Welt nach vorn, weil dort noch nie etwas lief; die
   schlichte Sortierung stellte ihn hinter jedes Stufe-4-Paket, und er kam nie
   an die Reihe. Es zählt stattdessen der Rang, den der Tutor selbst vergeben
   hat — sein Plan ist nach Wichtigkeit geordnet. Ein Elternwunsch hat keinen
   Rang; dort kommt die niedrigere Stufe zuerst, weil eine Voraussetzung vor
   dem gehört, was auf ihr aufbaut. */

/* Ab so vielen Aufgaben am Tag gilt das Kind nicht mehr als frisch. Zwei
   Pakete, dann kippt die Vorliebe von "frueh" auf "spaet". Gezählt wird der
   Tag, nicht die Sitzung — wer nachmittags neu anfängt, hat den Vormittag ja
   auch in den Knochen. */
const FRISCH_BIS = 16;

function sortiereVorrang(pool){
  const letzteWelt = (skillOf((UNITS[S.profile.lastUnitId] || {}).skill) || {}).area;
  const spaet = (S.profile.todayCount || 0) >= FRISCH_BIS;
  // C: ein aktiver, nicht erfüllter, nicht pausierter Elternwunsch schlägt
  // einen reinen Planposten — die Eltern haben, wie überall sonst, das letzte
  // Wort. Innerhalb der Wünsche selbst zählt kein Rang, sondern die Stufe:
  // eine Voraussetzung gehört vor das, was auf ihr aufbaut.
  const istWunsch = u => ["jetzt","mehr"].includes(wunschFuer(u));
  const planpunkt = u => (S.plan || []).find(p => p && p.skill === u.skill && p.art === "vor");
  const rang = u => {
    const i = (S.plan || []).findIndex(p => p && p.skill === u.skill && p.art === "vor");
    return i < 0 ? 99 : i;
  };
  /* Was der Tutor gewichtet hat, mal dem, was die Tageszeit dazu sagt. Ältere
     Pläne kennen kein Gewicht — dort gilt 1, und es entscheidet wie bisher
     seine Reihenfolge. So bleibt ein Plan von gestern brauchbar. */
  const wucht = u => {
    const p = planpunkt(u);
    if(!p) return 0;
    const g = (typeof p.gewicht === "number" && isFinite(p.gewicht))
      ? Math.max(0, Math.min(2, p.gewicht)) : 1;
    if(p.wann === "frueh") return g * (spaet ? 0.5 : 1.6);
    if(p.wann === "spaet") return g * (spaet ? 1.6 : 0.5);
    return g;
  };
  return pool.slice().sort((a, b) => {
    const wa = (skillOf(a.skill) || {}).area, wb = (skillOf(b.skill) || {}).area;
    if((wa === letzteWelt) !== (wb === letzteWelt))      // andere Welt zuerst
      return (wa === letzteWelt) - (wb === letzteWelt);
    const iwa = istWunsch(a), iwb = istWunsch(b);
    if(iwa !== iwb) return iwb - iwa;                    // Wunsch vor reinem Planposten
    if(iwa) return a.stage - b.stage;                    // unter Wünschen: Voraussetzung zuerst
    return wucht(b) - wucht(a)                           // sonst das Gewicht des Tutors
        || rang(a) - rang(b)                             // bei Gleichstand seine Reihenfolge
        || a.stage - b.stage                             // sonst von unten nach oben
        || ((S.units[a.id] || {}).plays || 0) - ((S.units[b.id] || {}).plays || 0);
  });
}

/* Das nächste Paket samt Begründung, falls von der schlichten Reihenfolge
   abgewichen wurde. Diese Funktion verändert nichts und protokolliert nichts —
   sie wird bei jedem Neuzeichnen aufgerufen. Festgehalten wird erst in
   startNext(), wenn das Kind wirklich losspielt. */
function waehleUnit(mehr){
  const log = [];
  let offen = DATA.units.filter(u => ((S.units[u.id] || {}).stars || 0) < 2);
  if(!offen.length) return {unit:DATA.units[0], schlicht:DATA.units[0], log};

  // B: Der Vorrangpool weiter unten (wunschFuer()==="jetzt"/"mehr" oder ein
  // Tutor-Planposten mit art:"vor") fragt nirgends nach "mehr" — ein aktiver
  // Elternwunsch holte darum im mehr-Lauf GENAU dasselbe Paket nach vorn wie
  // im Normal-Lauf, und der "Gib mir was Schwereres"-Knopf blieb wirkungslos.
  // Der Elternwunsch-Vorrang soll den Schwereres-Knopf deshalb nicht
  // leerlaufen lassen: Was waehleUnit(false) ohnehin liefern würde, fällt im
  // mehr-Lauf als Kandidat weg — außer danach bliebe gar nichts mehr übrig;
  // dann lieber dasselbe Paket als ein leerer Bildschirm (Verhalten wie
  // bisher). waehleUnit(false) ruft sich dabei nie selbst mit mehr=true auf,
  // also keine Rekursionsgefahr.
  if(mehr){
    const normal = waehleUnit(false).unit;
    const ohneNormal = offen.filter(u => u.id !== normal.id);
    if(ohneNormal.length) offen = ohneNormal;
  }

  const niveau = u => u.stage === areaStage((skillOf(u.skill) || {}).area) + (mehr ? 1 : 0);
  const passend = offen.filter(niveau);
  const hoeher = offen.filter(u => !niveau(u) &&
    u.stage > areaStage((skillOf(u.skill) || {}).area) + (mehr ? 1 : 0));
  const nachNiveau = passend.length ? passend : (hoeher.length ? hoeher : offen);

  // Was ohne jede Anpassung käme — daran misst sich, ob überhaupt abgewichen wurde.
  const schlicht = sortiere(nachNiveau, mehr)[0];

  // Ein Wunsch der Eltern — und ein Vorziehen des Tutors — holt auch etwas
  // herein, das sonst nicht auf dem Niveau läge. Genau daran hängt seine
  // Entscheidungsfreiheit: Will er Stufe 8 für ein Kind auf Stufe 2, bekommt
  // er sie. Die Elternseite zeigt den Sprung an, sperrt ihn aber nicht.
  // B: Ein pausiertes Paket wird dabei nicht hereingeholt — das Vorziehen ist
  // ja genau das, wogegen es gerade dreimal in Folge widersprochen hat.
  const pool = nachNiveau.concat(offen.filter(u => nachNiveau.indexOf(u) < 0 &&
    !istPausiert(u) &&
    (["jetzt","mehr"].includes(wunschFuer(u)) || (planFuer(u) || {}).art === "vor")));

  // Wer aus dem Rennen ist, und warum
  const raus = new Map();
  pool.forEach(u => {
    const w = wunschFuer(u), p = planFuer(u);
    if(w === "spaeter" || w === "weniger"){
      raus.set(u.id, {art:"ueber", grund:"wunsch_" + (w === "spaeter" ? "spaeter" : "weniger"),
                      belege:{}});
    }else if(p && (p.art === "ueber" || p.art === "zurueck")){
      // Der Tutor hat es beiseitegelegt. Seine Begründung reist mit, damit auf
      // der Elternseite sein Satz steht und nicht unser Schablonensatz.
      // Der Text bleibt im Plan auf dem Rechner; hier reist nur die Fertigkeit
      // mit. Sonst schleppte jeder Übertragungspuffer denselben Satz mehrfach.
      raus.set(u.id, {art:p.art, grund:"tutor", belege:{}});
    }else if(istLangweilig(u.skill)){
      const f = fenster(u.skill, LANGWEILIG_N);
      raus.set(u.id, {art:"ueber", grund:"langweilig",
                      belege:{n:f.length, c:f.reduce((s,x)=>s+x,0), l:stRead(u.skill).l}});
    }else if(istZuSchwer(u.skill) && !darfZurueck(u.skill)){
      const f = fenster(u.skill, ZU_SCHWER_N), v = vorbedingung(u.skill);
      raus.set(u.id, {art:"zurueck", grund:"zu_schwer",
                      belege:{n:f.length, c:f.reduce((s,x)=>s+x,0), vorher:v ? v.id : ""}});
    }
  });

  // Bleibt nichts übrig, greift keine Regel — lieber eine bekannte Aufgabe als
  // ein leerer Bildschirm.
  let rest = pool.filter(u => !raus.has(u.id));
  if(!rest.length) rest = pool;

  // C: Vorrangpool statt Entweder-Oder. Ein einzelner offener Elternwunsch hat
  // früher den kompletten Tutorplan verdeckt, solange er lief — jetzt stehen
  // Wunsch und Plan in einem gemeinsamen Pool, und sortiereVorrang() klärt
  // die Reihenfolge darin (Wunsch vor Plan). Pausierte Pakete (B) bleiben
  // draußen, auch wenn ein Wunsch oder Plan sie eigentlich vorzöge.
  const vorne = rest.filter(u => !istPausiert(u) &&
    (["jetzt","mehr"].includes(wunschFuer(u)) || (planFuer(u) || {}).art === "vor"));
  const gewaehlt = (vorne.length ? sortiereVorrang(vorne)
                                 : sortiere(rest, mehr))[0] || schlicht;

  if(gewaehlt.id !== schlicht.id){
    const weg = raus.get(schlicht.id);
    if(weg) log.push(Object.assign({u:schlicht}, weg));
    log.push(Object.assign({u:gewaehlt}, vorzugsGrund(gewaehlt, schlicht, weg)));
  }
  // schlicht kommt mit heraus, damit sich nachprüfen lässt, ob überhaupt
  // abgewichen wurde — genau daran hängt die Lückenlosigkeit des Protokolls.
  return {unit:gewaehlt, schlicht, log};
}

/* Warum ausgerechnet dieses Paket an die Stelle rückt. */
function vorzugsGrund(gewaehlt, schlicht, weg){
  const w = wunschFuer(gewaehlt);
  if(w === "jetzt" || w === "mehr")
    return {art:"vor", grund:"wunsch_" + (w === "jetzt" ? "jetzt" : "mehr"), belege:{}};

  const p = planFuer(gewaehlt);
  if(p && p.art === "vor")
    return {art:"vor", grund:"tutor", belege:{}};

  const v = weg && weg.grund === "zu_schwer" ? vorbedingung(schlicht.skill) : null;
  if(v && v.id === gewaehlt.skill){
    const f = fenster(schlicht.skill, ZU_SCHWER_N);
    return {art:"vor", grund:"vorbedingung",
            belege:{wegen:schlicht.skill, n:f.length, c:f.reduce((s,x)=>s+x,0)}};
  }

  const zuviel = ueberzogenerTyp();
  if(zuviel && typAnteilIn(gewaehlt, zuviel) < typAnteilIn(schlicht, zuviel))
    return {art:"vor", grund:"typenmischung",
            belege:{typ:zuviel, anteil:Math.round(typAnteile()[zuviel]*100)/100}};

  return {art:"vor", grund:"reihenfolge", belege:{}};
}

function nextUnit(mehr){ return waehleUnit(mehr).unit; }

/* Losspielen — und hier, genau einmal, die Entscheidung festhalten. */
function startNext(mehr){
  const w = waehleUnit(mehr);
  w.log.forEach(e => protokolliere(e.art, e.grund, {
    u:e.u.id, k:e.u.skill, g:e.u.stage, b:e.belege}));
  if(w.log.length) save();
  startUnit(w.unit.id);
}

/* Gibt es überhaupt etwas Schwereres als sein aktuelles Niveau? */
function hasHarder(){
  const u = nextUnit(true);
  return u && u.stage > areaStage((skillOf(u.skill) || {}).area);
}

/* Fällige Fertigkeiten nach dem Leitner-Prinzip. */
function dueSkills(){
  const now = Date.now();
  return Object.keys(S.skills).filter(id => {
    const x = S.skills[id];
    return skillOf(id) && x.l > 0 && x.d <= now;
  });
}

function ringSvg(pct){
  const r = 45, c = 2*Math.PI*r, off = c * (1 - Math.min(1, pct));
  return `<svg viewBox="0 0 104 104">
    <circle cx="52" cy="52" r="${r}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="9"/>
    <circle cx="52" cy="52" r="${r}" fill="none" stroke="url(#g)" stroke-width="9"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"
      style="transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)"/>
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25d0c0"/><stop offset="1" stop-color="#ffb238"/>
    </linearGradient></defs></svg>`;
}

/* ================================================================ Landkarte
   D1: Bei Modus "v2" zeigt die Karte statt der elf Stoffwelten die fünf
   Denkdisziplinen (renderDenkschule()); bei "v1" bleibt sie unverändert die
   klassische Weltenkarte. Beides teilt sich dieselben Paket-Kacheln
   (paketKacheln()) — gleiche Sterne, gleicher Lernstand, nur anders sortiert. */
function paketKacheln(us){
  return `<div class="packs">` + us.map(u => {
    const p = S.units[u.id] || {stars:0, plays:0};
    const s = "★".repeat(p.stars) + `<span class="off">${"★".repeat(3-p.stars)}</span>`;
    return `<button class="pk${p.stars?" done":""}" onclick="startUnit('${u.id}')">
        <span class="lv">Stufe ${u.stage}</span>
        <span class="t">${esc(u.title)}</span>
        <span class="s">${s}</span></button>`;
  }).join("") + `</div>`;
}

function weltKarte(a, us){
  const fertig = us.filter(u => ((S.units[u.id]||{}).stars||0) > 0).length;
  const pct = us.length ? fertig/us.length*100 : 0;
  return `<div class="uc">
      <div class="hd">
        <img src="${img(a.id)}" alt="">
        <div class="txt">
          <b>${a.emoji} ${esc(a.title)}</b>
          <div class="muted" style="font-size:13.5px">${esc(a.sub)}</div>
          <div class="bar"><i style="width:${pct}%"></i></div>
          <div class="muted" style="font-size:12.5px;margin-top:5px">
            ${fertig} von ${us.length} Paketen</div>
        </div>
      </div>` + paketKacheln(us) + `</div>`;
}

/* ---------------------------------------------------- D1: Denkschule-Karte
   Nur Darstellung: Welche Pakete unter welcher Disziplin-Kachel erscheinen,
   entscheidet allein disziplin_von()/DISZIPLINEN (build/disziplinen.py) —
   waehleUnit() und der Lernstand (S.units/S.skills) bleiben unberührt. */
const DISZIPLIN_EMOJI = {muster:"🌀", logik:"🧠", algorithmik:"🤖", kombinatorik:"🎲", raum:"📐"};
// Bildmotiv wiederverwenden, wo eine Disziplin einer bestehenden Stoffwelt
// entspricht (img() greift ohnehin auf IMG.hero zurück, wenn der Schlüssel fehlt).
const DISZIPLIN_BILD  = {muster:"muster", logik:"logik", algorithmik:"algo",
                          kombinatorik:"komb", raum:"geo"};
const PRE_LESSON_SET = new Set(PRE_LESSON_SKILLS);

const unitsOfDisziplin = key => DATA.units
  .filter(u => ((DISZIPLINEN[key] || {}).skills || []).includes(u.skill))
  .sort((a, b) => a.stage - b.stage || a.skill.localeCompare(b.skill));

function disziplinKarte(key, angaben, us){
  const fertig = us.filter(u => ((S.units[u.id]||{}).stars||0) > 0).length;
  const pct = us.length ? fertig/us.length*100 : 0;
  return `<div class="uc">
      <div class="hd">
        <img src="${img(DISZIPLIN_BILD[key] || key)}" alt="">
        <div class="txt">
          <b>${DISZIPLIN_EMOJI[key] || "🧩"} ${esc(angaben.titel)}</b>
          <div class="muted" style="font-size:13.5px">${esc(angaben.beschreibung)}</div>
          ${us.length ? `<div class="bar"><i style="width:${pct}%"></i></div>
          <div class="muted" style="font-size:12.5px;margin-top:5px">
            ${fertig} von ${us.length} Paketen</div>` : ""}
        </div>
      </div>` +
      (us.length ? paketKacheln(us)
        : `<div class="muted" style="padding:16px">Hier schlummert noch was — ` +
          `bald gibt es hier neue Rätsel.</div>`) +
      `</div>`;
}

/* Eingeklappt per Voreinstellung (view.opts.trainingOffen ist dann undefined).
   toggleTraining() ruft bewusst render() statt go(), damit der Zustand nicht
   bei jedem Klick verlorengeht — go() setzt view.opts sonst zurück. */
function toggleTraining(){
  view.opts.trainingOffen = !view.opts.trainingOffen;
  render();
}

function renderDenkschule(){
  const karten = Object.entries(DISZIPLINEN)
    .map(([key, angaben]) => disziplinKarte(key, angaben, unitsOfDisziplin(key))).join("");

  // Was keiner Disziplin zugeteilt ist (PRE_LESSON_SKILLS), bleibt über die
  // gewohnte Weltenkarte erreichbar — nur eben eingeklappt und nur mit dem,
  // was oben nicht schon unter einer Disziplin steht. Jedes Paket erscheint
  // dabei genau einmal: entweder oben oder hier unten, nie doppelt.
  const restAreas = AREAS.filter(a => unitsOfArea(a.id).some(u => PRE_LESSON_SET.has(u.skill)));
  if(!restAreas.length) return karten;

  const offen = !!view.opts.trainingOffen;
  const kopf = `<button class="btn wide" style="margin-bottom:${offen ? "10px" : "12px"};
      display:flex;justify-content:space-between" onclick="toggleTraining()">
      <span>📚 Schulstoff &amp; Training</span><span>${offen ? "▲" : "▼"}</span>
    </button>`;
  const inhalt = offen
    ? restAreas.map(a => weltKarte(a, unitsOfArea(a.id).filter(u => PRE_LESSON_SET.has(u.skill)))).join("")
    : "";
  return karten + kopf + inhalt;
}

VIEWS.map = function(){
  return `<div class="row" style="align-items:center;gap:12px;padding:16px 0 12px">
      <button class="btn" onclick="go('home')">←</button>
      <h2 style="margin:0">${S.settings.modus === "v2" ? "Die Denkschule" : "Die Welten"}</h2>
    </div>` +
    (S.settings.modus === "v2" ? renderDenkschule()
      : AREAS.map(a => { const us = unitsOfArea(a.id); return us.length ? weltKarte(a, us) : ""; }).join(""));
};

        ${S.profile.klasse

        Dein Lernstand bleibt in beiden Modi derselbe.</div>

      <div class="eyebrow" style="margin-bottom:5px">Rechner zu Hause</div>
      <input class="srv" id="srv" placeholder="z. B. https://192.168.1.20:8792"

        oninput="S.server=this.value.trim();save()">

      <button class="btn wide" style="margin-top:10px" onclick="checkUpdate()"

        </div>
        <button class="btn primary wide" style="margin-top:10px" onclick="downloadUpdate()">
          ⬇️ Herunterladen und aktualisieren</button>` : ""}

      ${UPD.stand ? `<div class="muted" style="margin-top:10px;font-size:14.5px">${esc(UPD.stand)}</div>` : ""}
    </div>

    <div class="card" style="margin-bottom:12px">
      <h3>Lernstand für die Elternseite</h3>
      <p class="muted">Gerätekennung: <code>${esc(S.dev)}</code>. Die Eltern erstellen dafür auf der
      Elternseite einen einmaligen Verbindungs-Code. Spielen bleibt immer offline möglich.</p>
      <input id="paircode" class="srv" placeholder="Verbindungs-Code der Eltern" autocomplete="off"

        Die App schickt dem Rechner zu Hause, welche Aufgaben du gelöst hast —
        und deinen Namen, wenn du ihn oben eingetragen hast. Ist er nicht
        erreichbar, wartet sie einfach.
        ${S.log.ev.length ? `<b style="color:var(--txt)">${S.log.ev.length}</b> noch nicht übertragen.`
                          : "Es liegt nichts mehr an."}
        ${S.log.lost ? ` ${S.log.lost} älter als ${LOG_TAGE} Tage und verfallen.` : ""}
      </div>
      <button class="btn wide" onclick="syncNow(false)" ${SYNC.laeuft ? "disabled" : ""}>
        ${SYNC.laeuft ? "…" : "📤 Jetzt übertragen"}</button>
      ${SYNC.stand ? `<div class="muted" style="margin-top:10px;font-size:14.5px">${esc(SYNC.stand)}</div>` : ""}

    <div class="card">
      <h3>Von vorn anfangen</h3>
      <div class="muted" style="margin:6px 0 10px">Löscht den kompletten Fortschritt.</div>
      <button class="btn" onclick="if(confirm('Wirklich alles löschen?')){
          S=freshState(); GEF.taufeSpaeter=false; GEF.nameSpaeter=false; GEF.nachfrage=null; GEF.blase=false;
          save(); go('home')}">
        🗑️ Alles löschen</button>

<script>
/* ============================================================ Session-Engine */
const TYPE_LABEL = {entdecken:"Neu entdecken", zahl:"Ausrechnen", wahl:"Auswählen",
  wahrfalsch:"Stimmt das?", ordnen:"Ordnen", zuordnen:"Zuordnen",
  mehrschritt:"Schritt für Schritt", gitter:"Hinschauen", logikgitter:"Logikrätsel",
  roboter:"Roboter", bildwahl:"Hinschauen", bildzahl:"Zählen", positionen:"Wer steht wo?"};
const KNOBEL_AREAS = ["logik", "komb", "muster"];

let SESS = null;

/* D6.1: Deckel des Spaß-Signals. Rein zur Laufzeit, wie GEF — überlebt kein
   Neuladen, damit eine neue App-Sitzung wieder eine Chance bekommt, es zu
   zeigen. Das eigentliche "höchstens jedes zweite Paketende" steuert das
   persistierte S.spassZaehler (siehe finishSession()). */
let SPASS = {gezeigtSitzung:false};

function beginSession(cfg){
  SITZUNG_ID = neueSitzungsId();
  SESS = Object.assign({i:0, asked:0, right:0, combo:0, answered:false, lastOk:false,
                        typed:"", chosen:-1, picked:[], sel:-1, matched:[], step:0,
                        stepVals:[], revealed:false, total:cfg.tasks.length,
                        // Logikgitter-Denkhilfe: rein lokale Notiz je Aufgabe,
                        // siehe denkhilfeHtml()/tapDenkzelle() — nie gespeichert.
                        denkOffen:false, denk:{},
                        // Roboter (programm-Modus): eigenes Programm des Kindes
                        // (prog) und der Zustand der Ablauf-Animation (anim/
                        // animTimer) — siehe qRoboter()/starteRoboterAnimation().
                        prog:[], anim:null, animTimer:null,
                        begonnen:Date.now(), gezeigt:Date.now()}, cfg);
  touchDay(); save();
  go("session");
}

const curTask = () => SESS.tasks[SESS.i];

/* Wie viele Aufgaben aus dem Paket wirklich gestellt werden.

   Bewusst nicht über planFuer(): Ein Elternwunsch entscheidet, DASS etwas
   drankommt — wie groß die Portion ausfällt, bleibt Sache des Tutors. Die
   beiden widersprechen sich nicht, und ohne diese Trennung liefe gerade das
   Gewünschte weiter in voller Länge auf ein Kind zu, das schon zweimal
   ausgestiegen ist. Ohne Vorgabe bleibt das Paket, wie es ist. */
function dosisFuer(u){
  const p = (S.plan || []).find(x => x && x.skill === u.skill);
  const d = p && typeof p.dosis === "number" && isFinite(p.dosis) ? Math.round(p.dosis) : 0;
  return d >= 2 ? Math.min(d, u.tasks.length) : u.tasks.length;
}

function startUnit(id){
  const u = UNITS[id];
  if(!u) return;
  S.profile.lastUnitId = id; save();
  // src und idx sagen dem Dienst später, welche Aufgabe erklärt werden soll —
  // ohne dass der Aufgabentext das Gerät verlassen muss. Erst abbilden, dann
  // kürzen: Sonst zeigt idx auf die falsche Aufgabe und die Erklärung passt
  // nicht zu dem, was auf dem Bildschirm steht.
  const alle = u.tasks.map((t, i) => Object.assign({}, t, {skill:u.skill, src:id, idx:i}));
  // D3: trägt der Planposten dieses Pakets ein "fuer", ist es Vorlauf für eine
  // andere Fertigkeit — sichtbar gemacht in VIEWS.session (SESS.vorlaufFuer).
  const plan = planFuer(u);
  const ziel = plan && plan.fuer ? skillOf(plan.fuer) : null;
  beginSession({kind:"unit", unitId:id, title:u.title, intro:u.intro,
                skill:u.skill, stage:u.stage, vorlaufFuer:ziel ? ziel.title : "",
                tasks:alle.slice(0, dosisFuer(u))});
}

/* Wiederholen: Aufgaben aus schon gespielten Paketen, deren Fertigkeit fällig
   ist. Gemischt, damit es sich nicht wie dasselbe Paket nochmal anfühlt. */
function startReview(){
  const due = new Set(dueSkills());
  const pool = [];
  DATA.units.forEach(u => {
    if(!S.units[u.id] || !due.has(u.skill)) return;
    u.tasks.forEach((t, i) => { if(t.type !== "entdecken")
      pool.push(Object.assign({}, t, {skill:u.skill, src:u.id, idx:i})); });
  });
  if(!pool.length) return;
  beginSession({kind:"review", unitId:null, title:"Wiederholen",
                intro:"Was länger her ist, kommt nochmal dran.",
                tasks:shuffle(pool).slice(0, 12)});
}

/* ------------------------------------------------------------- Bewertung */
function grade(ok){
  if(SESS.answered) return;
  const t = curTask();
  SESS.answered = true; SESS.lastOk = ok;

  // Für die Messung: wie lange stand die Aufgabe da, und bekam er den Tipp zu
  // sehen? Der erscheint automatisch bei einer falschen Antwort, sofern das
  // Paket einen mitbringt.
  const dauer = Math.max(0, Math.min(600000, Date.now() - (SESS.gezeigt || Date.now())));
  const gesehenerTipp = (!ok && t.hint) ? 1 : 0;
  const sk0 = skillOf(t.skill) || {};

  if(t.type !== "entdecken"){
    logEvent("a", {u:SESS.unitId || "", k:t.skill || "", g:sk0.stage || 0, y:t.type,
                   o:ok ? 1 : 0, ms:dauer, r:t.redo ? 1 : 0, h:gesehenerTipp});
    S.stats.answers++;
    if(!t.redo){ SESS.asked++; S.profile.todayCount++; }
    SESS.combo = ok ? SESS.combo + 1 : 0;
    S.stats.bestCombo = Math.max(S.stats.bestCombo, SESS.combo);
  }

  if(ok){
    if(t.type !== "entdecken"){
      S.stats.correct++;
      const sk = skillOf(t.skill);
      if(sk && KNOBEL_AREAS.includes(sk.area)) S.stats.knobel++;
    }
    sfx("right");
    addXP(t.redo ? XP_REDO : t.type === "entdecken" ? XP_LEARN : XP_FIRST);
    // „Neu entdecken“ wird nicht gewertet und zählt oben auch nicht als
    // gestellt. Zählte es hier als richtig, käme eine Sitzung mit zwei
    // Entdeckerkarten auf 8 von 6 — und die Elternseite hielte sie für zu
    // leicht, weil sie über 100 Prozent läge.
    if(!t.redo && t.type !== "entdecken") SESS.right++;
  }else{
    sfx("wrong");
    // Falsches kommt am Ende der Runde noch einmal – aber nur einmal.
    if(!t.redo) SESS.tasks.push(Object.assign({}, t, {redo:true}));
    // Zweiter Fehlversuch an derselben Aufgabe: jetzt reicht der feste Tipp
    // offensichtlich nicht. Nach dem Zeichnen anfragen, damit die Rückmeldung
    // sofort steht und die Erklärung nachrückt.
    else setTimeout(() => holeErklaerung(t), 0);
  }

  // Fortschritt der Fertigkeit fortschreiben (Leitner)
  if(t.skill && t.type !== "entdecken"){
    const x = st(t.skill), sk = skillOf(t.skill);
    if(ok){ x.c++; if(!t.redo) x.l = Math.min(MAX_L, x.l + 1); }
    else  { x.w++; x.l = Math.max(0, x.l - 1); }
    x.d = Date.now() + INTERVALS[Math.min(MAX_L, x.l)]*DAY;
    // Kurzzeitgedächtnis: Nur daran lässt sich ablesen, ob etwas gerade eben
    // sitzt oder gerade eben kippt.
    x.h.push(ok ? 1 : 0);
    if(x.h.length > H_MAX) x.h.shift();
    S.typLog.push(t.type);
    if(S.typLog.length > TYP_FENSTER) S.typLog.shift();
  }else if(t.skill){
    const x = st(t.skill);
    if(x.l === 0){ x.l = 1; x.d = Date.now(); }   // gesehen ist nicht geübt
    // Getrennt gezählt: eine Entdeckerseite ist keine Antwort und darf die
    // Trefferquote nicht verwässern.
    logEvent("n", {u:SESS.unitId || "", k:t.skill, g:sk0.stage || 0, ms:dauer});
  }
  save();
  render();
}

function nextTask(){
  // Ein laufender Roboter-Animationstimer darf nicht in die nächste Aufgabe
  // hineinzeichnen — vor jedem Wechsel zuerst abbrechen.
  stopRoboterAnimation();
  SESS.i++;
  Object.assign(SESS, {answered:false, lastOk:false, typed:"", chosen:-1, picked:[],
                       sel:-1, matched:[], step:0, stepVals:[], revealed:false,
                       denkOffen:false, denk:{}, prog:[], anim:null, animTimer:null,
                       gezeigt:Date.now()});
  if(SESS.i >= SESS.tasks.length) return finishSession();
  render();
}

function finishSession(){
  const pct = SESS.asked ? SESS.right/SESS.asked : 1;
  const stars = pct >= .9 ? 3 : pct >= .72 ? 2 : 1;
  const stufeVorher = baseStage();
  let firstTime = false, spassFragen = false;

  if(SESS.kind === "unit"){
    const prev = S.units[SESS.unitId] || {stars:0, plays:0, sofort:0, pausiertBis:0, rev:""};
    firstTime = prev.plays === 0;
    // sofort/pausiertBis bleiben erhalten — sie gehören vermerkeAbbruch(), das
    // gleich danach läuft, nicht dieser Zeile. D6.2: die aktuelle Fassung
    // (rev) wird mitgemerkt, damit ein späterer Bau mit anderem Inhalt
    // erkennbar ist (siehe pruefeRevisionen()).
    const u = UNITS[SESS.unitId] || {};
    S.units[SESS.unitId] = Object.assign({}, prev,
      {stars:Math.max(prev.stars, stars), plays:prev.plays+1, rev:u.rev || prev.rev || ""});
    if(firstTime) S.stats.packs++;
    // B: ein vollständiger Lauf ohne eine einzige Antwort ist ebenfalls ein
    // Sofort-Abbruch (siehe vermerkeAbbruch); jeder Lauf mit Antworten setzt
    // den Zähler zurück.
    const sofortAbbruch = vermerkeAbbruch(SESS.unitId, SESS.asked);
    // D6: derselbe Anlass wie bei quitSession() — siehe dort für den zweiten
    // (das Verlassen vor der Hälfte, das hier nicht vorkommen kann, weil
    // finishSession() nur bei vollständig gespielter Runde erreicht wird).
    nachAbbruchFragen(SESS.unitId, sofortAbbruch);
    // A: erst ein VOLLSTÄNDIG gespieltes Paket erfüllt einen "jetzt"-Wunsch —
    // finishSession() wird nur bei vollständiger Runde erreicht.
    pruefeWunschErfuellung(UNITS[SESS.unitId]);
    // D6.1: das Spaß-Signal. Höchstens einmal je Sitzung (SPASS.gezeigtSitzung,
    // eine reine Laufzeit-Marke wie GEF — überlebt kein Neuladen) und
    // zusätzlich höchstens bei jedem zweiten Paketende, abwechselnd
    // (S.spassZaehler, persistiert): so wird es nie zur Routine-Klickerei.
    S.spassZaehler = (S.spassZaehler || 0) + 1;
    if(!SPASS.gezeigtSitzung && S.spassZaehler % 2 === 1){
      spassFragen = true;
      SPASS.gezeigtSitzung = true;
    }
  }
  const res = {stars, pct:Math.round(pct*100), right:SESS.right, asked:SESS.asked,
               title:SESS.title, kind:SESS.kind, unitId:SESS.unitId,
               aufstieg:baseStage() > stufeVorher ? baseStage() : 0,
               spassFragen, spassAntwort:0};
  // 7: nie eine enttäuschte Pose — Misserfolg wird nicht kommentiert, nur
  // unterschiedlich stark gefeiert.
  GEF.reaktion = res.pct >= 75 ? "jubelt" : "freut"; GEF.reaktionBis = Date.now() + 4000;
  addXP(stars*25);
  checkBadges(); save();
  sfx("done");
  confetti(res.aufstieg ? 200 : stars >= 3 ? 160 : 100);
  if(res.aufstieg){
    sfx("level");
    setTimeout(() => toast("🔥 Schwierigkeit " + res.aufstieg + " freigeschaltet"), 700);
  }
  logEvent("s", {q:SESS.kind, u:SESS.unitId || "", n:SESS.asked, c:SESS.right,
                 ms:Date.now() - SESS.begonnen, z:0});
  save();
  syncLeise();
  SESS = null;
  go("result", {res});
}

/* D6.1: die Antwort auf das Spaß-Signal — ein Tipp, kein Freitext (Z1). Wird
   von VIEWS.result aus aufgerufen; view.opts.res ist dieselbe Objektreferenz,
   die dort gerade angezeigt wird, deshalb genügt ein erneutes render(). */
function gibSpassFeedback(wert){
  const r = view.opts.res;
  if(!r || !r.spassFragen || r.spassAntwort) return;
  logEvent("f", {u:r.unitId || "", w:wert});
  r.spassAntwort = wert;
  save();
  syncLeise();
  render();
}

function quitSession(){
  if(!SESS) return go("home");
  if(SESS.i > 2 && !confirm("Wirklich abbrechen? Was du schon geschafft hast, bleibt gespeichert.")) return;
  // Ein Abbruch ist ein Messwert, kein Nichts: kurze Sitzungen sind das
  // Warnzeichen für Über- und Unterforderung.
  // D6: der zweite Anlass für die Fuchs-Nachfrage neben dem Sofort-Abbruch —
  // ein Paket, das mit weniger als der Hälfte seiner Aufgaben verlassen wird.
  const wenigerAlsHaelfte = SESS.total > 0 && SESS.i < SESS.total / 2;
  const sofortAbbruch = SESS.kind === "unit" ? vermerkeAbbruch(SESS.unitId, SESS.asked) : false;
  logEvent("s", {q:SESS.kind, u:SESS.unitId || "", n:SESS.asked, c:SESS.right,
                 ms:Date.now() - SESS.begonnen, z:1});
  const unitId = SESS.unitId, kind = SESS.kind;
  save();
  syncLeise();
  stopRoboterAnimation();
  SESS = null;
  nachAbbruchFragen(unitId, kind === "unit" && (sofortAbbruch || wenigerAlsHaelfte));
  go("home");
}
</script>

<script>
/* ================================================================ Ansichten */
const RENDER = {entdecken:qEntdecken, zahl:qZahl, wahl:qWahl, wahrfalsch:qWahrFalsch,
                ordnen:qOrdnen, zuordnen:qZuordnen, mehrschritt:qMehrschritt, gitter:qGitter,
                logikgitter:qLogikgitter, roboter:qRoboter, bildwahl:qBildwahl,
                bildzahl:qBildzahl, positionen:qPositionen};

VIEWS.session = function(){
  if(!SESS) return VIEWS.home();
  const t = curTask();
  const pct = Math.min(100, SESS.i/Math.max(1,SESS.total)*100);
  return `<div class="stop">
      <button class="btn" style="min-height:44px;padding:10px 15px" onclick="quitSession()">✕</button>
      <div class="prog"><i style="width:${pct}%"></i></div>
      <span class="combo">${SESS.asked ? SESS.right + "/" + SESS.asked : ""}</span>
    </div>
    ${SESS.i === 0 && SESS.vorlaufFuer ? `<div class="muted" style="text-align:center;
        margin:2px 0 10px;font-size:14.5px">
        Das hilft dir gleich bei: <b style="color:var(--txt)">${esc(SESS.vorlaufFuer)}</b>
        ${readBtn("Das hilft dir gleich bei " + SESS.vorlaufFuer)}</div>` : ""}
    <div id="fitwrap"><div>
      <div class="roundlbl">
        <div class="eyebrow">${TYPE_LABEL[t.type] || ""}${t.redo ? " · nochmal" : ""}</div>
      </div>
      <div class="card">${RENDER[t.type](t)}</div>
    </div></div>`;
};

function contBtn(label){
  return `<button class="btn primary wide" style="margin-top:14px" onclick="nextTask()" id="cont">
    ${label || "Weiter"}</button>`;
}

/* Gemeinsame Rückmeldung. Die Lösung steht immer dabei – auch wenn richtig
   geantwortet wurde, denn dann prägt sie sich ein. */
const LOB   = ["Sitzt.","Genau.","Richtig.","Stark.","Perfekt.","Läuft.","Sauber."];
const NOPE  = ["Noch nicht ganz.","Knapp daneben.","Das war's nicht."];
function feedback(t, loesung){
  const ok = SESS.lastOk;
  const line = ok ? LOB[(Math.random()*LOB.length)|0] : NOPE[(Math.random()*NOPE.length)|0];

  // Beim zweiten Fehlversuch tritt die ausführliche Erklärung an die Stelle des
  // festen Tipps. Kommt keine, bleibt es beim Tipp — ohne Fehlermeldung.
  const meins = ERK.fuer === erkSchluessel(t);
  const b = meins && ERK.beispiel;
  const erklaerung = !meins ? ""
    : ERK.laeuft ? `<div class="tip">💭 Warte kurz, ich such dir ein Beispiel …</div>`
    : ERK.text ? `<div class="tip">💡 ${esc(ERK.text)}
        ${b ? `<div class="bsp">${esc(b.frage)}
          <span class="rw">${esc(b.rechnung)} = ${esc(fmtNum(b.ergebnis))}</span></div>` : ""}
      </div>` : "";

  // Die Lösung steht da — aber zu wissen, was herauskommt, ist nicht dasselbe
  // wie zu wissen, wie man daraufkommt. Wer will, holt sich die Erklärung
  // sofort, statt auf den zweiten Fehlversuch zu warten. Bewusst ein Knopf und
  // nicht von allein: Wer die Aufgabe verstanden hat und sich nur vertippt hat,
  // soll nicht mit einer Erklärung aufgehalten werden.
  const erkKnopf = (!ok && !meins && kannErklaeren(t))
    ? `<button class="erk" onclick="holeErklaerung(curTask())">🤔 Erklär es mir</button>`
    : "";

  return `<div class="fb ${ok?"ok":"no"}">
    <div style="font-size:18px">${ok ? "✓ " : "✗ "}${line}</div>
    ${loesung ? `<div class="sol">${loesung}</div>` : ""}
    ${!ok && t.hint && !(meins && ERK.text) ? `<div class="tip">💡 ${esc(t.hint)}</div>` : ""}
    ${erklaerung}${erkKnopf}
  </div>`;
}

/* Der Fragekopf. Lange Texte kleiner setzen, damit nichts vom Bildschirm fällt. */
function head(t, extra){
  const lang = String(t.q || "").length > 60;
  return `<div class="q" style="padding-bottom:10px">
      <div class="word${lang ? " sm" : ""}">${esc(t.q)}</div>
      ${readBtn(t.q)}
      ${extra || ""}
    </div>`;
}

/* ---- Neu entdecken: zeigen, erklären, weiter ---- */
function qEntdecken(t){
  return head(t) +
    `<div class="info">${esc(t.info || "")}</div>
     ${readBtn(t.info)}
     <button class="btn primary wide" style="margin-top:14px" id="cont"
       onclick="grade(true);nextTask()">Verstanden</button>`;
}

/* ---- Ausrechnen: eigenes Ziffernfeld ---- */
function padKey(k){
  if(SESS.answered) return;
  sfx("tap");
  if(k === "del") SESS.typed = SESS.typed.slice(0, -1);
  else if(SESS.typed.length < 7) SESS.typed += k;
  render();
}
function numpad(onCheck){
  const keys = ["1","2","3","4","5","6","7","8","9","del","0","ok"];
  return `<div class="pad">` + keys.map(k => {
      if(k === "del") return `<button class="del" onclick="padKey('del')" ${SESS.answered?"disabled":""}>⌫</button>`;
      if(k === "ok")  return `<button class="act" onclick="${onCheck}" ${SESS.answered||!SESS.typed?"disabled":""}>✓</button>`;
      return `<button onclick="padKey('${k}')" ${SESS.answered?"disabled":""}>${k}</button>`;
    }).join("") + `</div>`;
}
function display(cls){
  return `<div class="disp ${cls || ""}">${SESS.typed
    ? esc(SESS.typed) : `<span class="ph">Deine Antwort</span>`}</div>`;
}

function checkZahl(){
  if(SESS.answered || !SESS.typed) return;
  grade(numEq(SESS.typed, curTask().a));
}
function qZahl(t){
  const cls = SESS.answered ? (SESS.lastOk ? "right" : "wrong") : "";
  return head(t) + display(cls) +
    (SESS.answered
      ? feedback(t, `Richtig ist <b>${fmtNum(t.a)}</b>.`) + contBtn()
      : numpad("checkZahl()"));
}

/* ---- Auswählen ---- */
function chooseMc(i){
  if(SESS.answered) return;
  SESS.chosen = i;
  grade(i === curTask().correct);
}
function qWahl(t){
  const rows = t.opts.map((o,i) => ({o, i}))
    .filter(r => !SESS.answered || r.i === t.correct || r.i === SESS.chosen);
  return head(t) + `<div class="opts">` + rows.map(r =>
      `<button class="opt${SESS.answered ? (r.i === t.correct ? " right" : " wrong") : ""}"
        ${SESS.answered?"disabled":""} onclick="chooseMc(${r.i})">
        <span class="muted" style="font-weight:800;margin-right:9px">${r.i+1}</span>${esc(r.o)}</button>`
    ).join("") + `</div>` +
    (SESS.answered ? feedback(t, `Richtig ist <b>${esc(t.opts[t.correct])}</b>.`) + contBtn() : "");
}

/* ---- Stimmt das? ---- */
function qWahrFalsch(t){
  return head(t) +
    (SESS.answered
      ? feedback(t, `Die Behauptung ist <b>${t.a ? "richtig" : "falsch"}</b>.`) + contBtn()
      : `<div class="row" style="margin-top:16px">
           <button class="btn teal grow" style="min-height:64px;font-size:19px"
             onclick="grade(${t.a} === true)">✓ Stimmt</button>
           <button class="btn grow" style="min-height:64px;font-size:19px"
             onclick="grade(${t.a} === false)">✗ Stimmt nicht</button>
         </div>`);
}

/* ---- Ordnen: Karten in der richtigen Reihenfolge antippen ---- */
function pickChip(i){
  if(SESS.answered || SESS.picked.includes(i)) return;
  sfx("tap");
  SESS.picked.push(i);
  const t = curTask();
  if(SESS.picked.length === t.items.length){
    grade(SESS.picked.every((v, k) => v === t.order[k]));
  }else render();
}
function qOrdnen(t){
  const slots = t.items.map((_, k) => {
    const idx = SESS.picked[k];
    return `<div class="slot${idx === undefined ? "" : " set"}">${
      idx === undefined ? k+1 : fmtNum(t.items[idx])}</div>`;
  }).join("");
  const chips = t.items.map((v, i) => {
    let cls = SESS.picked.includes(i) ? " used" : "";
    if(SESS.answered) cls = SESS.picked[t.order.indexOf(i)] === i ? " right" : " wrong";
    return `<button class="chip${cls}" onclick="pickChip(${i})"
      ${SESS.answered?"disabled":""}>${fmtNum(v)}</button>`;
  }).join("");
  return head(t) +
    `<div class="slotrow">${slots}</div>
     <div class="chips">${chips}</div>` +
    (SESS.answered
      ? feedback(t, "Richtig ist <b>" + t.order.map(i => fmtNum(t.items[i])).join(" · ") + "</b>.")
        + contBtn()
      : (SESS.picked.length
         ? `<button class="btn wide" style="margin-top:12px"
              onclick="SESS.picked=[];render()">↺ Nochmal legen</button>` : ""));
}

/* ---- Zuordnen: links antippen, dann rechts ---- */
function pickLeft(i){
  if(SESS.answered || SESS.matched.some(m => m[0] === i)) return;
  sfx("tap"); SESS.sel = SESS.sel === i ? -1 : i; render();
}
function pickRight(j){
  if(SESS.answered || SESS.sel < 0 || SESS.matched.some(m => m[1] === j)) return;
  const t = curTask();
  SESS.matched.push([SESS.sel, j]);
  SESS.sel = -1;
  if(SESS.matched.length === t.pairs.length){
    grade(SESS.matched.every(([a,b]) => a === SESS.rightOrder[b]));
  }else{ sfx("tap"); render(); }
}
function qZuordnen(t){
  // Die rechte Spalte wird einmal gemischt; rightOrder merkt sich, welche
  // linke Karte dazugehört. Ohne das Merken wäre die Zuordnung nach dem
  // Neuzeichnen eine andere.
  //
  // Gemischt wird so, dass KEINE Karte auf der Höhe ihres Partners landet.
  // Bloßes Mischen reicht nicht: bei drei Paaren steht jede sechste Ziehung
  // wieder in der Ausgangsreihenfolge — dann ist die Aufgabe durch bloßes
  // Danebenlegen lösbar, ohne eine einzige Rechnung.
  if(!SESS.rightOrder || SESS.rightFor !== SESS.i){
    const n = t.pairs.length;
    let idx = t.pairs.map((_, i) => i);
    for(let versuch = 0; versuch < 20; versuch++){
      idx = shuffle(t.pairs.map((_, i) => i));
      if(idx.every((src, j) => src !== j)) break;
    }
    // Notnagel, falls der Zufall zwanzigmal danebengreift: um eins verschieben
    // ist immer verschoben.
    if(idx.some((src, j) => src === j)) idx = t.pairs.map((_, i) => (i + 1) % n);
    SESS.rightOrder = idx;           // Platz j rechts gehört zu links idx[j]
    SESS.rightFor = SESS.i;
  }
  const links = t.pairs.map((p, i) => {
    const done = SESS.matched.some(m => m[0] === i);
    const cls = done ? " done" : (SESS.sel === i ? " sel" : "");
    return `<button class="pcard${cls}" onclick="pickLeft(${i})"
      ${SESS.answered?"disabled":""}>${esc(p[0])}</button>`;
  });
  const rechts = SESS.rightOrder.map((src, j) => {
    const m = SESS.matched.find(x => x[1] === j);
    let cls = m ? " done" : "";
    if(SESS.answered && m) cls = m[0] === src ? " done" : " miss";
    return `<button class="pcard${cls}" onclick="pickRight(${j})"
      ${SESS.answered?"disabled":""}>${esc(t.pairs[src][1])}</button>`;
  });
  const rows = links.map((l, i) => l + rechts[i]).join("");
  const loesung = t.pairs.map(p => esc(p[0]) + " → <b>" + esc(p[1]) + "</b>").join("<br>");
  return head(t) +
    `<div class="pairs">${rows}</div>` +
    (SESS.answered ? feedback(t, loesung) + contBtn()
      : (SESS.matched.length
         ? `<button class="btn wide" style="margin-top:12px"
              onclick="SESS.matched=[];SESS.sel=-1;render()">↺ Nochmal</button>` : ""));
}

/* ---- Schritt für Schritt ---- */
function checkStep(){
  const t = curTask(), s = t.steps[SESS.step];
  if(SESS.answered || !SESS.typed) return;
  const ok = numEq(SESS.typed, s.a);
  SESS.stepVals.push({typed:SESS.typed, ok});
  if(!ok) return grade(false);                 // ein falscher Schritt beendet die Aufgabe
  if(SESS.step + 1 >= t.steps.length) return grade(true);
  SESS.step++; SESS.typed = ""; sfx("right"); render();
}
function qMehrschritt(t){
  const s = t.steps[SESS.step];
  const dots = t.steps.map((_, i) =>
    `<span class="stepdot${i < SESS.step ? " ok" : i === SESS.step ? " on" : ""}"></span>`).join("");
  const cls = SESS.answered ? (SESS.lastOk ? "right" : "wrong") : "";
  const loesung = t.steps.map((x, i) =>
    `${i+1}. ${esc(x.q)} <b>${fmtNum(x.a)}</b>`).join("<br>");
  return `<div class="steps">${dots}</div>
    <div class="story">${esc(t.q)} ${readBtn(t.q)}</div>
    <div class="q" style="padding:4px 8px 10px">
      <div class="word sm">${esc(s.q)}</div>
    </div>` + display(cls) +
    (SESS.answered ? feedback(t, loesung) + contBtn() : numpad("checkStep()"));
}

/* ---- Hinschauen: kleines Gitter, Feld antippen oder auswählen ---- */
function pickCell(r, c){
  if(SESS.answered) return;
  const t = curTask();
  SESS.chosen = r * 100 + c;
  grade(t.cell[0] === r && t.cell[1] === c);
}
function qGitter(t){
  const cols = t.grid[0].length;
  const tapbar = !!t.cell;
  const cells = t.grid.map((row, r) => row.map((v, c) => {
    const isSol = tapbar && t.cell[0] === r && t.cell[1] === c;
    const gewaehlt = SESS.chosen === r * 100 + c;
    let cls = "";
    if(SESS.answered && isSol) cls = " right";
    else if(SESS.answered && gewaehlt) cls = " wrong";
    return tapbar
      ? `<button class="cell${cls}" onclick="pickCell(${r},${c})" ${SESS.answered?"disabled":""}>${esc(v)}</button>`
      : `<div class="cell">${esc(v)}</div>`;
  }).join("")).join("");

  const gitter = `<div class="grid" style="grid-template-columns:repeat(${cols},auto)">${cells}</div>`;

  if(tapbar){
    return head(t) + gitter +
      (SESS.answered ? feedback(t, "Das grüne Feld war richtig.") + contBtn() : "");
  }
  // Variante mit Antwortmöglichkeiten unter dem Gitter
  const rows = (t.opts || []).map((o,i) => ({o, i}))
    .filter(r => !SESS.answered || r.i === t.correct || r.i === SESS.chosen);
  return head(t) + gitter + `<div class="opts">` + rows.map(r =>
      `<button class="opt${SESS.answered ? (r.i === t.correct ? " right" : " wrong") : ""}"
        ${SESS.answered?"disabled":""} onclick="chooseMc(${r.i})">
        <span class="muted" style="font-weight:800;margin-right:9px">${r.i+1}</span>${esc(r.o)}</button>`
    ).join("") + `</div>` +
    (SESS.answered ? feedback(t, `Richtig ist <b>${esc(t.opts[t.correct])}</b>.`) + contBtn() : "");
}

/* ---- Logikgitter (D1/D4): Rahmengeschichte, nummerierte Hinweise, eine
   aufklappbare Denkhilfe zum Mitnotieren und die Antwort als große Knöpfe
   (Mechanik wie bei "wahl": genau eine richtig, gleiche Wertung/Sterne/XP).
   Die Struktur von t entspricht exakt validate_v2.pruefe_logikgitter_aufgabe:
   kategorien, hinweise (mit .text), frage_text, optionen, richtig, loesung,
   dazu optional 'rahmen' (Rahmengeschichte der Aufgabe). */
function logikVorlesetext(t){
  const rahmen = t.rahmen || (SESS && SESS.intro) || "";
  const hinweise = (t.hinweise || []).map(h => h.text).join(" ");
  return [rahmen, hinweise, t.frage_text || ""].filter(Boolean).join(" ");
}

/* Zellwert -> Zeichen: 0 leer, 1 ✓, 2 ✗ — reine Merkhilfe, zählt nirgends mit. */
const denkzelleZeichen = v => v === 1 ? "✓" : v === 2 ? "✗" : "";

function toggleDenkhilfe(){
  SESS.denkOffen = !SESS.denkOffen;
  render();
}

/* Tippen schaltet zyklisch leer -> ✓ -> ✗ -> leer. SESS.denk ist rein lokaler
   Sitzungszustand (siehe beginSession()/nextTask()) — er wird nie gespeichert,
   nie protokolliert und fließt in keine Wertung ein. */
function tapDenkzelle(schluessel){
  if(!SESS.denk) SESS.denk = {};
  SESS.denk[schluessel] = ((SESS.denk[schluessel] || 0) + 1) % 3;
  render();
}

function denkhilfeHtml(t){
  const subjekte = t.kategorien[0] || [];
  const spalten = [];
  for(let kat = 1; kat < t.kategorien.length; kat++)

    const zellen = spalten.map(sp => {
      const schluessel = `${r}_${sp.kat}_${sp.idx}`;
      const v = (SESS.denk || {})[schluessel] || 0;
      const cls = v === 1 ? " ja" : v === 2 ? " nein" : "";
      return `<td><button class="dh-cell${cls}" onclick="tapDenkzelle('${schluessel}')">
        ${denkzelleZeichen(v)}</button></td>`;
    }).join("");
    return `<tr><th>${esc(subjekt)}</th>${zellen}</tr>`;
  }).join("");

  return `<div class="denkhilfe">
      <button class="dh-toggle" onclick="toggleDenkhilfe()">
        ${SESS.denkOffen ? "▲ Denkhilfe verbergen" : "▼ Denkhilfe zum Mitnotieren"}</button>
      ${SESS.denkOffen ? `<div class="dh-scroll"><table class="dh-table">
          <thead><tr>${kopf}</tr></thead><tbody>${zeilen}</tbody></table></div>
        <div class="muted" style="font-size:12.5px;margin-top:7px">
          Nur zum Merken – zählt nicht mit.</div>` : ""}
    </div>`;
}

function chooseLogik(i){

}

function qLogikgitter(t){
